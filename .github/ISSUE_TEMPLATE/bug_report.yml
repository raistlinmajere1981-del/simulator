name: Hata bildirimi
description: Yeniden üretilebilir bir uygulama, hesap, veri veya persistence hatası bildirin.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Teşekkürler. Gerçek özel fotoğraf, kesin kişisel koordinat veya hassas deney dosyası yüklemeyin; mümkünse sentetik/minimum örnek kullanın.
  - type: input
    id: version
    attributes:
      label: Sürüm / commit
      placeholder: "1.34.1 veya commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Alan
      options:
        - Hedef/Ufuk/Uzun Mesafe
        - Güneş/Ay
        - Gölge
        - Yıldız
        - Tutulma
        - Arazi / DEM / GeoJSON / CSV
        - Fotoğraf kalibrasyonu
        - Atmosfer
        - Su yüzeyi / datum / jeoit
        - Kayıt / JSON / rapor
        - AI çalışma döngüsü
        - Electron / genel UI
        - Diğer
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Sorun
      description: Ne oldu ve ne olmasını bekliyordunuz?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Yeniden üretme adımları
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: İlgili girdiler / birimler / kaynak
      description: Bilimsel sonucu etkiliyorsa kullanılan değerleri, birimleri, datum/zaman ve kaynak türünü yazın.
  - type: input
    id: os
    attributes:
      label: İşletim sistemi
      placeholder: "Ubuntu 24.04 / Windows 11 / ..."
  - type: textarea
    id: logs
    attributes:
      label: Hata çıktısı / log
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Kontrol
      options:
        - label: Sorunun hassas/kişisel veri içermediğini kontrol ettim.
          required: true
        - label: Mümkünse güncel main veya son release üzerinde yeniden denedim.
