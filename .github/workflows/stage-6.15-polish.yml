name: Stage 6.15 Polish

on:
  push:
    branches:
      - agent/stellar-local-horizon-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stellar-local-horizon-ui
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: node scripts/apply-stage-6.15-polish.mjs
      - name: Check diff
        run: git diff --check
      - name: Commit polish
        shell: bash
        run: |
          if git diff --quiet -- docs/roadmap.md src/renderer/src/StellarObservationPanel.tsx src/renderer/src/AppNext.tsx; then
            echo "No polish change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md src/renderer/src/StellarObservationPanel.tsx src/renderer/src/AppNext.tsx
          git commit -m "Aşama 6.15 yol haritası ve UI metinlerini güncelle"
          git push origin HEAD:agent/stellar-local-horizon-ui
