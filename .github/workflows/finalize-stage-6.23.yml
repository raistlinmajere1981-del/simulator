name: Stage 6.23 final guarded fixes

on:
  push:
    branches:
      - agent/stellar-motion-source-ui
    paths:
      - .github/workflows/finalize-stage-6.23.yml
      - .github/scripts/finalize-stage-6.23.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stellar-motion-source-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final guarded fixes
        run: node .github/scripts/finalize-stage-6.23.mjs
      - name: Validate and commit product/test files only
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/report.test.ts tests/stellar-skyline-portable.test.ts tests/stellar-motion-source.test.ts src/main/index.ts src/renderer/src/StellarObservationPanel.tsx src/renderer/src/stellar-observation-panel.css
          git diff --cached --quiet && exit 1
          git commit -m "Aşama 6.23 final test ve kaynak UX düzeltmelerini uygula"
          git push origin HEAD:agent/stellar-motion-source-ui
