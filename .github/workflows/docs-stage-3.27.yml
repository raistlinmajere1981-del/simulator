name: Update stage 3.27 docs

on:
  push:
    branches:
      - agent/scenario-horizon-long-distance
    paths:
      - scripts/update_stage_3_27_docs.py

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scenario-horizon-long-distance
          fetch-depth: 0
      - name: Update docs
        run: python scripts/update_stage_3_27_docs.py
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md
          if git diff --cached --quiet; then
            echo "No docs update required"
            exit 0
          fi
          git commit -m "docs: mark scenario workflows complete"
          git push origin HEAD:agent/scenario-horizon-long-distance
