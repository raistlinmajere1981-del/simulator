name: Apply stage 5.5 contextual help

on:
  push:
    branches: [agent/contextual-help-system]
    paths:
      - scripts/apply_stage_5_5_help.py
      - .github/workflows/apply-stage-5-5-help.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contextual-help-system
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_stage_5_5_help.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate contextual help system"
          git push origin HEAD:agent/contextual-help-system
