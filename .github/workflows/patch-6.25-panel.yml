name: Patch 6.25 stellar panel

on:
  push:
    branches:
      - agent/dem-skyline-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dem-skyline-ui
      - name: Apply guarded stellar panel patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/renderer/src/StellarObservationPanel.tsx')
          text = path.read_text()

          replacements = []
          replacements.append((
            "import { DraftNumberInput } from './DraftNumberInput';\n",
            "import { DraftNumberInput } from './DraftNumberInput';\nimport { StellarDemSkylineControl } from './StellarDemSkylineControl';\n",
            'panel import'
          ))
          replacements.append((
            """  return source
              ? { ...source, points: source.points.map((point) => ({ ...point })), warnings: [...source.warnings] }
              : undefined;
          """,
            """  return source
              ? {
                  ...source,
                  points: source.points.map((point) => ({ ...point })),
                  warnings: [...source.warnings],
                  ...(source.demDerivation ? { demDerivation: { ...source.demDerivation } } : {})
                }
              : undefined;
          """,
            'clone source'
          ))
          replacements.append((
            """  settings,
            externalLocalHorizonSource,
            stellarMotionSource,
          """,
            """  settings,
            observerHeightM,
            externalLocalHorizonSource,
            stellarMotionSource,
          """,
            'props destructure'
          ))
          replacements.append((
            """  settings: StellarObservationSettings;
            externalLocalHorizonSource?: SavedStellarLocalHorizonSource;
          """,
            """  settings: StellarObservationSettings;
            observerHeightM: number;
            externalLocalHorizonSource?: SavedStellarLocalHorizonSource;
          """,
            'props type'
          ))
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}')
              text = text.replace(old, new, 1)

          return_anchor = """  return (
              <section className="panel stellar-observation-panel">
          """
          prepare_fn = """  const prepareDemSkylineSource = (source: SavedStellarLocalHorizonSource): void => {
            setDraftExternalLocalHorizonSource(cloneExternalSource(source));
            setLocalHorizonDraft((current) => ({
              ...current,
              localHorizonEnabled: true,
              localHorizonSourceMode: 'external'
            }));
            setHorizonImportMessage(`“${source.fileName}” DEM skyline taslağı hazır. Uygula ve hesapla ile yıldız izine bağlanacak.`);
          };

          """
          if text.count(return_anchor) != 1:
              raise SystemExit(f'return anchor count={text.count(return_anchor)}')
          text = text.replace(return_anchor, prepare_fn + return_anchor, 1)

          source_card_anchor = """        {draftExternalLocalHorizonSource && (
                    <div className={usesExternalDraft ? 'stellar-skyline-source-card selected' : 'stellar-skyline-source-card'}>
          """
          source_card_replacement = """        <StellarDemSkylineControl
                  observerLatitudeDeg={result.latitudeDeg}
                  observerLongitudeDeg={result.longitudeDeg}
                  observerHeightM={observerHeightM}
                  onPreparedSource={prepareDemSkylineSource}
                />

                {draftExternalLocalHorizonSource && (
                    <div className={usesExternalDraft ? 'stellar-skyline-source-card selected' : 'stellar-skyline-source-card'}>
          """
          if text.count(source_card_anchor) != 1:
              raise SystemExit(f'source card anchor count={text.count(source_card_anchor)}')
          text = text.replace(source_card_anchor, source_card_replacement, 1)

          source_span = """              <span>{draftExternalLocalHorizonSource.format.toUpperCase()} · {draftExternalLocalHorizonSource.pointCount} nokta · en büyük boşluk {angleFormatter.format(draftExternalLocalHorizonSource.maximumAzimuthGapDeg)}°</span>
          """
          source_span_replacement = """              <span>{draftExternalLocalHorizonSource.format === 'dem' ? 'DEM · türetilmiş geometrik' : draftExternalLocalHorizonSource.format.toUpperCase()} · {draftExternalLocalHorizonSource.pointCount} nokta · en büyük boşluk {angleFormatter.format(draftExternalLocalHorizonSource.maximumAzimuthGapDeg)}°</span>
                  {draftExternalLocalHorizonSource.demDerivation && (
                    <span>ΔA {angleFormatter.format(draftExternalLocalHorizonSource.demDerivation.azimuthStepDeg)}° · Δs {angleFormatter.format(draftExternalLocalHorizonSource.demDerivation.distanceStepM)} m · menzil {angleFormatter.format(draftExternalLocalHorizonSource.demDerivation.maximumDistanceM / 1_000)} km · {draftExternalLocalHorizonSource.demDerivation.samplingMethod}</span>
                  )}
          """
          if text.count(source_span) != 1:
              raise SystemExit(f'source span anchor count={text.count(source_span)}')
          text = text.replace(source_span, source_span_replacement, 1)

          empty_source = """        {localHorizonDraft.localHorizonEnabled && usesExternalDraft && !draftExternalLocalHorizonSource && (
                    <p className="stellar-skyline-source-empty">Dış profil seçmek için CSV/TSV/TXT/JSON skyline dosyası içe aktar.</p>
                  )}
          """
          empty_replacement = """        {localHorizonDraft.localHorizonEnabled && usesExternalDraft && !draftExternalLocalHorizonSource && (
                    <p className="stellar-skyline-source-empty">Dış profil için CSV/TSV/TXT/JSON skyline içe aktar veya üstteki ESRI ASCII DEM'den tam 360° geometrik profil üret.</p>
                  )}
          """
          if text.count(empty_source) != 1:
              raise SystemExit(f'empty source anchor count={text.count(empty_source)}')
          text = text.replace(empty_source, empty_replacement, 1)

          path.write_text(text)
          PY
      - name: Commit protected patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/renderer/src/StellarObservationPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate staged DEM skyline control into stellar panel"
          git push origin HEAD:agent/dem-skyline-ui
