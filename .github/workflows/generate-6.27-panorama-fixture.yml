name: Generate 6.27 panorama fixture
on:
  push:
    branches: [agent/panorama-skyline-ui]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panorama-skyline-ui
      - name: Generate deterministic PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import math, struct, zlib
          width, height = 1600, 800
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  t = y / (height - 1)
                  # calm blue-gray sky to dark ground
                  sky = y < 430
                  if sky:
                      r = int(48 + 45 * (1 - t))
                      g = int(96 + 65 * (1 - t))
                      b = int(128 + 75 * (1 - t))
                  else:
                      r, g, b = 38, 46, 42
                  # synthetic skyline: rolling ridge plus two clear peaks
                  ridge = 435 - 55 * math.sin(2 * math.pi * x / width) - 28 * math.sin(6 * math.pi * x / width)
                  ridge -= 85 * math.exp(-((x - 470) / 95) ** 2)
                  ridge -= 115 * math.exp(-((x - 1110) / 125) ** 2)
                  if y >= ridge:
                      r, g, b = 37, 58, 48
                  row.extend((r, g, b))
              rows.append(bytes(row))
          raw = b''.join(rows)
          def chunk(kind, payload):
              return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          out = Path('docs/examples/panorama-skyline-example.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(png)
          PY
      - name: Commit fixture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/examples/panorama-skyline-example.png
          git commit -m "Add synthetic panorama skyline fixture"
          git push origin HEAD:agent/panorama-skyline-ui
