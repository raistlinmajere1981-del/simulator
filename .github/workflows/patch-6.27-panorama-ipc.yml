name: Patch 6.27 panorama IPC wiring
on:
  push:
    branches: [agent/panorama-skyline-ui]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panorama-skyline-ui
      - name: Apply guarded wiring patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count={s.count(old)} for {old!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/main/index.ts',
              "import { registerStellarDemSkylineHandlers } from './stellar-dem-skyline-ipc';",
              "import { registerStellarDemSkylineHandlers } from './stellar-dem-skyline-ipc';\nimport { registerStellarPanoramaSkylineHandlers } from './stellar-panorama-skyline-ipc';"
          )
          replace_once(
              'src/main/index.ts',
              "function registerExperimentHandlers(): void {\n  registerStellarDemSkylineHandlers();",
              "function registerExperimentHandlers(): void {\n  registerStellarDemSkylineHandlers();\n  registerStellarPanoramaSkylineHandlers();"
          )

          replace_once(
              'src/shared/simulator.ts',
              "  ImportStellarDemSkylineResult,\n  SavedStellarLocalHorizonSource,",
              "  ImportStellarDemSkylineResult,\n  ImportStellarPanoramaSkylineResult,\n  SavedStellarLocalHorizonSource,"
          )
          replace_once(
              'src/shared/simulator.ts',
              "  importStellarDemSkyline(): Promise<ImportStellarDemSkylineResult>;\n  generateStellarDemSkyline(",
              "  importStellarDemSkyline(): Promise<ImportStellarDemSkylineResult>;\n  importStellarPanoramaSkyline(): Promise<ImportStellarPanoramaSkylineResult>;\n  generateStellarDemSkyline("
          )

          replace_once(
              'src/preload/index.ts',
              "  ImportStellarDemSkylineResult,\n  StellarDemSkylineGenerationSettings",
              "  ImportStellarDemSkylineResult,\n  ImportStellarPanoramaSkylineResult,\n  StellarDemSkylineGenerationSettings"
          )
          replace_once(
              'src/preload/index.ts',
              "  importStellarDemSkyline: () =>\n    ipcRenderer.invoke('stellar-skyline-dem:import') as Promise<ImportStellarDemSkylineResult>,\n  generateStellarDemSkyline:",
              "  importStellarDemSkyline: () =>\n    ipcRenderer.invoke('stellar-skyline-dem:import') as Promise<ImportStellarDemSkylineResult>,\n  importStellarPanoramaSkyline: () =>\n    ipcRenderer.invoke('stellar-skyline-panorama:import') as Promise<ImportStellarPanoramaSkylineResult>,\n  generateStellarDemSkyline:"
          )
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/index.ts src/shared/simulator.ts src/preload/index.ts
          git commit -m "Wire panorama skyline import IPC"
          git push origin HEAD:agent/panorama-skyline-ui
