name: Validate DEM line-of-sight preview branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dem-line-of-sight-preview-bootstrap.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dem-line-of-sight-preview
          fetch-depth: 0

      - name: Apply product changes
        run: python3 scripts/apply-dem-line-of-sight-preview.py

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary branch files
        run: rm -f scripts/apply-dem-line-of-sight-preview.py .github/workflows/apply-dem-line-of-sight-preview.yml

      - name: Commit product changes to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview DEM terrain along the line of sight"
          git push origin HEAD:agent/dem-line-of-sight-preview

# Trigger validation
