name: Apply stage 6.5 integration

on:
  push:
    branches:
      - agent/solar-day-events
    paths:
      - scripts/apply_stage_6_5.py
      - .github/workflows/apply-stage-6-5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/solar-day-events
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_stage_6_5.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate solar day event workflow"
          git push origin HEAD:agent/solar-day-events
