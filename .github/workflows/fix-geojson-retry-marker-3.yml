name: Apply structural GeoJSON retry marker fix

on:
  push:
    branches:
      - agent/geojson-terrain-profile-import
    paths:
      - .github/workflows/fix-geojson-retry-marker-3.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geojson-terrain-profile-import
          fetch-depth: 0

      - name: Replace marker lines structurally
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/retry-geojson-terrain-profile.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if 'app_section_start = script.index' in line]
          if len(matches) != 1:
              raise RuntimeError(f'Expected one app_section_start line, found {len(matches)}')
          index = matches[0]
          replacement = [
              "          app_block_end = script.index(\"\\n\\nportable_path = 'src/shared/portable.ts'\")",
              "          app_block_start = script.rfind(\"replace_regex(\", 0, app_block_end)",
              "          if app_block_start < 0:",
              "              raise RuntimeError('AppNext source replacement block not found')"
          ]
          lines[index:index + 3] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          for name in [
              'fix-geojson-retry-marker.yml',
              'fix-geojson-retry-marker-2.yml',
              'fix-geojson-retry-marker-3.yml'
          ]:
              Path('.github/workflows', name).unlink(missing_ok=True)
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix GeoJSON retry AppNext marker"
          git push origin HEAD:agent/geojson-terrain-profile-import
