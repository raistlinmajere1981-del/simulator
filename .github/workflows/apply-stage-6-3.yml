name: Apply stage 6.3 integration

on:
  push:
    branches:
      - agent/shadow-observation
    paths:
      - scripts/apply_stage_6_3.py
      - .github/workflows/apply-stage-6-3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/shadow-observation
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python scripts/apply_stage_6_3.py
      - name: Remove temporary patch machinery
        run: rm scripts/apply_stage_6_3.py .github/workflows/apply-stage-6-3.yml
      - name: Commit integrated stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: integrate stage 6.3 shadow observation"
          git push origin HEAD:agent/shadow-observation
