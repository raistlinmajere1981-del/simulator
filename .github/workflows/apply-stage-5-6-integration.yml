name: Apply stage 5.6 integration
on:
  push:
    branches: [agent/text-experiment-preparation]
    paths:
      - scripts/apply_stage_5_6_integration.py
      - .github/workflows/apply-stage-5-6-integration.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/text-experiment-preparation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_stage_5_6_integration.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate controlled text experiment setup"
          git push origin HEAD:agent/text-experiment-preparation
