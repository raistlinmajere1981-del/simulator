name: Execute GeoJSON product with npm install

on:
  push:
    branches:
      - agent/geojson-terrain-profile-import
    paths:
      - .github/workflows/execute-geojson-product-install.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geojson-terrain-profile-import
          fetch-depth: 0

      - name: Apply GeoJSON product changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/execute-geojson-product.yml').read_text(encoding='utf-8')
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'execute-geojson-product.py', 'exec'))
          PY

      - name: Preserve workflow files
        run: git restore --source=HEAD -- .github/workflows

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "add GeoJSON terrain profile import"
          git push origin HEAD:agent/geojson-terrain-profile-import
