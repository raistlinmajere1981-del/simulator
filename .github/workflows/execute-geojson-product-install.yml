name: Execute GeoJSON product with npm install

on:
  push:
    branches:
      - agent/geojson-terrain-profile-import
    paths:
      - .github/workflows/execute-geojson-product-install.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geojson-terrain-profile-import
          fetch-depth: 0

      - name: Apply GeoJSON product changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/execute-geojson-product.yml').read_text(encoding='utf-8')
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'execute-geojson-product.py', 'exec'))
          PY

      - name: Add explicit union type guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper_path = Path('src/simulation/terrain-import-application.ts')
          helper = helper_path.read_text(encoding='utf-8')
          helper = helper.replace(
              "  ImportedTerrainProfile,\n  SimulatorInputs",
              "  SimulatorInputs,\n  TerrainProfileImport"
          )
          helper = helper.replace(
              'profile: ImportedTerrainProfile',
              'profile: TerrainProfileImport'
          )
          helper_path.write_text(helper, encoding='utf-8')

          editor_path = Path('src/renderer/src/MultiPointTerrainEditor.tsx')
          editor = editor_path.read_text(encoding='utf-8')
          import_start = editor.index('import type {\n')
          import_end_marker = "} from '../../shared/simulator';"
          import_end = editor.index(import_end_marker, import_start) + len(import_end_marker)
          editor_import = """import type {
            CsvTerrainDistanceUnit,
            ImportedGeoJsonTerrainProfile,
            TerrainProfileImport,
            TerrainProfileMappingRequest
          } from '../../shared/simulator';"""
          editor = editor[:import_start] + editor_import + editor[import_end:]
          editor = editor.replace('ImportedTerrainProfile', 'TerrainProfileImport')

          label_start = editor.index('function distanceUnitLabel(')
          label_end = editor.index('function delimiterLabel(', label_start)
          label_functions = """function isGeoJsonProfile(
            profile: TerrainProfileImport
          ): profile is ImportedGeoJsonTerrainProfile {
            return 'kind' in profile && profile.kind === 'geojson';
          }

          function distanceUnitLabel(profile: TerrainProfileImport): string {
            if (isGeoJsonProfile(profile)) return 'WGS84 koordinatları';
            if (profile.distanceUnit === 'percent') return 'rotanın yüzdesi';
            if (profile.distanceUnit === 'km') return 'kilometre';
            return 'metre';
          }

          function sourceDistanceLabel(profile: TerrainProfileImport): string {
            if (profile.sourceDistanceM === null) return 'Konumlar yüzde olarak verilmiş';
            const sourceLabel = isGeoJsonProfile(profile) ? 'GeoJSON rotası' : 'CSV rotası';
            return `${numberFormatter.format(profile.sourceDistanceM / 1_000)} km ${sourceLabel}`;
          }

          """
          editor = editor[:label_start] + label_functions + editor[label_end:]

          pending_start = editor.index('      {pendingImport && (\n')
          metric_start = editor.index('          <div className="terrain-import-metrics">', pending_start)
          endpoint_start = editor.index('          <div className="terrain-endpoint-options">', metric_start)
          profile_details = """          <div className="terrain-import-metrics">
            <div>
              <small>{isGeoJsonProfile(pendingImport) ? 'GeoJSON koordinatı' : 'Dosyadaki veri satırı'}</small>
              <strong>{isGeoJsonProfile(pendingImport) ? pendingImport.coordinateCount : pendingImport.rowCount}</strong>
            </div>
            <div><small>Kullanılacak ara nokta</small><strong>{pendingImport.points.length}</strong></div>
            <div><small>Konumların birimi</small><strong>{distanceUnitLabel(pendingImport)}</strong></div>
            <div><small>Dosyadaki toplam rota</small><strong>{sourceDistanceLabel(pendingImport)}</strong></div>
            <div><small>Başlangıç → bitiş yüksekliği</small><strong>{numberFormatter.format(pendingImport.observerEndpointElevationM)} → {numberFormatter.format(pendingImport.targetEndpointElevationM)} m</strong></div>
          </div>
          {isGeoJsonProfile(pendingImport) ? (
            <div className="terrain-import-columns">
              <span>Geometri: <b>{pendingImport.geometryType}</b></span>
              <span>Yükseklik kaynağı: <b>koordinatların üçüncü bileşeni (Z)</b></span>
              <span>Başlangıç: <b>{pendingImport.startLatitudeDeg.toFixed(6)}°, {pendingImport.startLongitudeDeg.toFixed(6)}°</b></span>
              <span>Bitiş: <b>{pendingImport.endLatitudeDeg.toFixed(6)}°, {pendingImport.endLongitudeDeg.toFixed(6)}°</b></span>
            </div>
          ) : (
            <div className="terrain-import-columns">
              <span>Rotadaki yer sütunu: <b>{pendingImport.distanceColumnHeader}</b></span>
              <span>Arazi yüksekliği sütunu: <b>{pendingImport.elevationColumnHeader}</b></span>
            </div>
          )}
"""
          editor = editor[:metric_start] + profile_details + editor[endpoint_start:]
          editor_path.write_text(editor, encoding='utf-8')

          app_path = Path('src/renderer/src/AppNext.tsx')
          app = app_path.read_text(encoding='utf-8')
          if 'type ImportedGeoJsonTerrainProfile,' not in app:
              if '  type TerrainProfileImport,\n' in app:
                  app = app.replace(
                      '  type TerrainProfileImport,\n',
                      '  type ImportedGeoJsonTerrainProfile,\n  type TerrainProfileImport,\n',
                      1
                  )
              elif '  type ImportedTerrainProfile,\n' in app:
                  app = app.replace(
                      '  type ImportedTerrainProfile,\n',
                      '  type ImportedGeoJsonTerrainProfile,\n  type TerrainProfileImport,\n',
                      1
                  )
              else:
                  raise RuntimeError('Terrain profile import type was not found in AppNext')
          app = app.replace('ImportedTerrainProfile', 'TerrainProfileImport')

          helper_marker = 'function TerrainPanel({'
          if 'function isImportedGeoJsonTerrainProfile(' not in app:
              helper_functions = """function isImportedGeoJsonTerrainProfile(
            profile: TerrainProfileImport
          ): profile is ImportedGeoJsonTerrainProfile {
            return 'kind' in profile && profile.kind === 'geojson';
          }

          function isCsvTerrainProfileSource(
            source: TerrainProfileSource
          ): source is Extract<TerrainProfileSource, { kind: 'csv' }> {
            return source.kind === 'csv';
          }

          """
              if app.count(helper_marker) != 1:
                  raise RuntimeError('TerrainPanel marker was not found exactly once')
              app = app.replace(helper_marker, helper_functions + helper_marker, 1)

          app = app.replace(
              "'kind' in profile && profile.kind === 'geojson'",
              'isImportedGeoJsonTerrainProfile(profile)'
          )

          source_start_marker = '      {source && (\n'
          source_end_marker = '\n\n      {terrainEnabled && ('
          source_start = app.index(source_start_marker)
          source_end = app.index(source_end_marker, source_start)
          source_block = """      {source && (
            <div className={`terrain-source-strip ${source.modifiedAfterImport ? 'modified' : ''}`}>
              <div>
                <strong>{isCsvTerrainProfileSource(source) ? 'CSV kaynağı' : 'GeoJSON kaynağı'}: {source.fileName}</strong>
                {isCsvTerrainProfileSource(source) ? (
                  <span>{source.distanceColumnHeader} → mesafe · {source.elevationColumnHeader} → yükseklik · {source.rowCount} satır</span>
                ) : (
                  <span>{source.coordinateCount} koordinat · WGS84 LineString · Z → yükseklik</span>
                )}
              </div>
              <span>{source.modifiedAfterImport ? 'İÇE AKTARIMDAN SONRA DÜZENLENDİ' : 'KAYNAKLA EŞLEŞİYOR'}</span>
            </div>
          )}"""
          app = app[:source_start] + source_block + app[source_end:]
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Preserve workflow files
        run: git restore --source=HEAD -- .github/workflows

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "add GeoJSON terrain profile import"
          git push origin HEAD:agent/geojson-terrain-profile-import
