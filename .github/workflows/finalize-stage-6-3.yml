name: Finalize stage 6.3

on:
  push:
    branches:
      - agent/shadow-observation
    paths:
      - scripts/finalize_stage_6_3.py
      - .github/workflows/finalize-stage-6-3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shadow-observation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/finalize_stage_6_3.py
      - run: rm scripts/finalize_stage_6_3.py .github/workflows/finalize-stage-6-3.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: preserve solar report wording in stage 6.3"
          git push origin HEAD:agent/shadow-observation
