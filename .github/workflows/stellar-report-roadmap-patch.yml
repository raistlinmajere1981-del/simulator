name: Stellar Report Roadmap Patch

on:
  push:
    branches:
      - agent/stellar-observation-ui

permissions:
  contents: write

jobs:
  patch-report-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stellar-observation-ui
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded report and roadmap patch
        run: node scripts/apply-stellar-report-roadmap.mjs

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet -- src/report/html-report.ts docs/roadmap.md; then
            echo "No report/roadmap changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/report/html-report.ts docs/roadmap.md
          git commit -m "Aşama 6.8 rapor ve roadmap entegrasyonunu bağla"
          git push origin HEAD:agent/stellar-observation-ui
