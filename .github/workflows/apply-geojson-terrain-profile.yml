name: Apply GeoJSON terrain profile stage

on:
  push:
    branches:
      - agent/geojson-terrain-profile-import
    paths:
      - .github/workflows/apply-geojson-terrain-profile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geojson-terrain-profile-import
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(textwrap.dedent(content).lstrip(), encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:80]!r}')
              Path(path).write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: regex expected one match, found {count}: {pattern[:100]!r}')
              Path(path).write_text(updated, encoding='utf-8')

          write('src/simulation/geojson-terrain-profile.ts', r'''
          import { basename } from 'node:path';
          import type {
            ImportedGeoJsonTerrainProfile,
            TerrainProfileImportContext
          } from '../shared/simulator';
          import type { ManualTerrainPoint } from '../shared/terrain';
          import { inverseWgs84Geodesic } from './geodesy';
          import { validateManualTerrainPoints } from './manual-terrain-profile';

          const MAX_COORDINATE_COUNT = 2_002;
          const MAX_ROUTE_DISTANCE_M = 20_000_000;
          const MIN_ELEVATION_M = -12_000;
          const MAX_ELEVATION_M = 100_000;
          const MIN_SEGMENT_DISTANCE_M = 0.001;

          interface GeoJsonCoordinate {
            longitudeDeg: number;
            latitudeDeg: number;
            elevationM: number;
          }

          interface ExtractedLineString {
            coordinates: unknown[];
            customCrsPresent: boolean;
          }

          function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === 'object' && value !== null && !Array.isArray(value);
          }

          function validateContext(context: TerrainProfileImportContext): void {
            if (!Number.isFinite(context.routeDistanceM) || context.routeDistanceM <= 0 ||
              context.routeDistanceM > MAX_ROUTE_DISTANCE_M) {
              throw new RangeError('GeoJSON içe aktarma için geçerli bir deney mesafesi gerekli.');
            }
            if (!Number.isFinite(context.observerGroundElevationM) ||
              !Number.isFinite(context.targetGroundElevationM)) {
              throw new RangeError('GeoJSON içe aktarma için geçerli uç zemin yükseklikleri gerekli.');
            }
          }

          function lineStringCoordinates(geometry: unknown): unknown[] | null {
            if (!isRecord(geometry) || geometry.type !== 'LineString' ||
              !Array.isArray(geometry.coordinates)) {
              return null;
            }
            return geometry.coordinates;
          }

          function extractLineString(value: unknown): ExtractedLineString {
            if (!isRecord(value)) {
              throw new Error('GeoJSON kök değeri bir nesne olmalı.');
            }

            const customCrsPresent = value.crs !== undefined && value.crs !== null;
            const direct = lineStringCoordinates(value);
            if (direct) return { coordinates: direct, customCrsPresent };

            if (value.type === 'Feature') {
              const coordinates = lineStringCoordinates(value.geometry);
              if (!coordinates) {
                throw new Error('GeoJSON Feature yalnızca 3B LineString geometrisi içermeli.');
              }
              return { coordinates, customCrsPresent };
            }

            if (value.type === 'FeatureCollection') {
              if (!Array.isArray(value.features)) {
                throw new Error('GeoJSON FeatureCollection features dizisi içermeli.');
              }
              const matches = value.features
                .filter(isRecord)
                .map((feature) => lineStringCoordinates(feature.geometry))
                .filter((coordinates): coordinates is unknown[] => coordinates !== null);
              if (matches.length === 0) {
                throw new Error('GeoJSON FeatureCollection içinde LineString bulunamadı.');
              }
              if (matches.length > 1) {
                throw new Error('GeoJSON dosyasında birden fazla LineString var; tek rota gerekli.');
              }
              return { coordinates: matches[0] ?? [], customCrsPresent };
            }

            throw new Error('Yalnız LineString, Feature veya tek hatlı FeatureCollection desteklenir.');
          }

          function parseCoordinate(value: unknown, index: number): GeoJsonCoordinate {
            if (!Array.isArray(value) || value.length < 3) {
              throw new Error(
                `${index + 1}. GeoJSON koordinatı [boylam, enlem, yükseklik] biçiminde olmalı.`
              );
            }
            const longitudeDeg = value[0];
            const latitudeDeg = value[1];
            const elevationM = value[2];
            if (typeof longitudeDeg !== 'number' || !Number.isFinite(longitudeDeg) ||
              longitudeDeg < -180 || longitudeDeg > 180) {
              throw new RangeError(`${index + 1}. koordinatın boylamı -180…180° aralığında olmalı.`);
            }
            if (typeof latitudeDeg !== 'number' || !Number.isFinite(latitudeDeg) ||
              latitudeDeg < -90 || latitudeDeg > 90) {
              throw new RangeError(`${index + 1}. koordinatın enlemi -90…90° aralığında olmalı.`);
            }
            if (typeof elevationM !== 'number' || !Number.isFinite(elevationM) ||
              elevationM < MIN_ELEVATION_M || elevationM > MAX_ELEVATION_M) {
              throw new RangeError(
                `${index + 1}. koordinatın yüksekliği ${MIN_ELEVATION_M}…${MAX_ELEVATION_M} m aralığında olmalı.`
              );
            }
            return { longitudeDeg, latitudeDeg, elevationM };
          }

          function differenceWarning(
            label: string,
            importedValue: number,
            currentValue: number,
            unit: string
          ): string | null {
            if (Math.abs(importedValue - currentValue) <= 0.01) return null;
            return `GeoJSON ${label} ${importedValue.toLocaleString('tr-TR', { maximumFractionDigits: 3 })} ${unit}; mevcut deney ${currentValue.toLocaleString('tr-TR', { maximumFractionDigits: 3 })} ${unit}. Uygulama aşamasında hangi değerin kullanılacağı seçilebilir.`;
          }

          export function parseTerrainProfileGeoJson(
            content: string,
            fileName: string,
            context: TerrainProfileImportContext
          ): ImportedGeoJsonTerrainProfile {
            validateContext(context);
            let parsed: unknown;
            try {
              parsed = JSON.parse(content.replace(/^\uFEFF/, '')) as unknown;
            } catch {
              throw new Error('Seçilen dosya geçerli JSON içermiyor.');
            }

            const extracted = extractLineString(parsed);
            if (extracted.coordinates.length < 2) {
              throw new Error('GeoJSON rotası en az başlangıç ve bitiş koordinatı içermeli.');
            }
            if (extracted.coordinates.length > MAX_COORDINATE_COUNT) {
              throw new Error(`GeoJSON rotası en fazla ${MAX_COORDINATE_COUNT} koordinat içerebilir.`);
            }

            const coordinates = extracted.coordinates.map(parseCoordinate);
            const cumulativeDistancesM: number[] = [0];
            let totalDistanceM = 0;
            let fallbackSegmentCount = 0;

            for (let index = 1; index < coordinates.length; index += 1) {
              const previous = coordinates[index - 1];
              const current = coordinates[index];
              if (!previous || !current) continue;
              const segment = inverseWgs84Geodesic(
                { latitudeDeg: previous.latitudeDeg, longitudeDeg: previous.longitudeDeg },
                { latitudeDeg: current.latitudeDeg, longitudeDeg: current.longitudeDeg }
              );
              if (segment.distanceM <= MIN_SEGMENT_DISTANCE_M) {
                throw new RangeError(
                  `${index}. ve ${index + 1}. GeoJSON koordinatları aynı konumu tanımlıyor.`
                );
              }
              if (segment.method === 'spherical-fallback') fallbackSegmentCount += 1;
              totalDistanceM += segment.distanceM;
              if (totalDistanceM > MAX_ROUTE_DISTANCE_M) {
                throw new RangeError('GeoJSON rota uzunluğu 20.000 km sınırını aşıyor.');
              }
              cumulativeDistancesM.push(totalDistanceM);
            }

            if (!Number.isFinite(totalDistanceM) || totalDistanceM <= 0) {
              throw new Error('GeoJSON rota uzunluğu hesaplanamadı.');
            }

            const points: ManualTerrainPoint[] = coordinates.slice(1, -1).map((coordinate, index) => ({
              id: `geojson-coordinate-${index + 2}`,
              distancePercent: cumulativeDistancesM[index + 1]! / totalDistanceM * 100,
              elevationM: coordinate.elevationM
            }));
            const validationErrors = validateManualTerrainPoints(points);
            if (validationErrors.length > 0) {
              throw new Error(`GeoJSON arazi noktaları geçersiz: ${validationErrors.join(' ')}`);
            }

            const first = coordinates[0]!;
            const last = coordinates[coordinates.length - 1]!;
            const warnings: string[] = [];
            const routeWarning = differenceWarning(
              'toplam rota mesafesi',
              totalDistanceM / 1_000,
              context.routeDistanceM / 1_000,
              'km'
            );
            const observerWarning = differenceWarning(
              'başlangıç zemin yüksekliği',
              first.elevationM,
              context.observerGroundElevationM,
              'm'
            );
            const targetWarning = differenceWarning(
              'bitiş zemin yüksekliği',
              last.elevationM,
              context.targetGroundElevationM,
              'm'
            );
            if (routeWarning) warnings.push(routeWarning);
            if (observerWarning) warnings.push(observerWarning);
            if (targetWarning) warnings.push(targetWarning);
            if (fallbackSegmentCount > 0) {
              warnings.push(
                `${fallbackSegmentCount} rota parçasında Vincenty yakınsamayıp küresel yedek çözüm kullandı.`
              );
            }
            if (extracted.customCrsPresent) {
              warnings.push(
                'GeoJSON crs alanı dikkate alınmadı; koordinatlar RFC 7946 gereği WGS84 boylam/enlem olarak yorumlandı.'
              );
            }

            return {
              kind: 'geojson',
              fileName: basename(fileName),
              geometryType: 'LineString',
              coordinateCount: coordinates.length,
              sourceDistanceM: totalDistanceM,
              startLongitudeDeg: first.longitudeDeg,
              startLatitudeDeg: first.latitudeDeg,
              endLongitudeDeg: last.longitudeDeg,
              endLatitudeDeg: last.latitudeDeg,
              elevationSource: 'coordinate-z',
              observerEndpointElevationM: first.elevationM,
              targetEndpointElevationM: last.elevationM,
              points,
              warnings
            };
          }
          ''')

          write('tests/geojson-terrain-profile.test.ts', r'''
          import { describe, expect, it } from 'vitest';
          import { parseTerrainProfileGeoJson } from '../src/simulation/geojson-terrain-profile';

          const context = {
            routeDistanceM: 2_226.39,
            observerGroundElevationM: 4,
            targetGroundElevationM: 5
          };

          describe('GeoJSON terrain profile import', () => {
            it('parses a 3D LineString and derives cumulative WGS84 route percentages', () => {
              const profile = parseTerrainProfileGeoJson(JSON.stringify({
                type: 'LineString',
                coordinates: [
                  [0, 0, 4],
                  [0.01, 0, 22],
                  [0.02, 0, 5]
                ]
              }), '/tmp/equator.geojson', context);

              expect(profile.kind).toBe('geojson');
              expect(profile.fileName).toBe('equator.geojson');
              expect(profile.coordinateCount).toBe(3);
              expect(profile.sourceDistanceM).toBeCloseTo(2_226.39, 0);
              expect(profile.points).toHaveLength(1);
              expect(profile.points[0]).toMatchObject({ elevationM: 22 });
              expect(profile.points[0]?.distancePercent).toBeCloseTo(50, 6);
              expect(profile.observerEndpointElevationM).toBe(4);
              expect(profile.targetEndpointElevationM).toBe(5);
            });

            it('accepts a FeatureCollection containing exactly one LineString', () => {
              const profile = parseTerrainProfileGeoJson(JSON.stringify({
                type: 'FeatureCollection',
                features: [
                  { type: 'Feature', properties: { name: 'route' }, geometry: {
                    type: 'LineString',
                    coordinates: [[29, 41, 3], [29.01, 41.005, 8]]
                  }},
                  { type: 'Feature', properties: {}, geometry: {
                    type: 'Point', coordinates: [29, 41, 3]
                  }}
                ]
              }), 'route.json', context);

              expect(profile.coordinateCount).toBe(2);
              expect(profile.points).toEqual([]);
              expect(profile.sourceDistanceM).toBeGreaterThan(900);
            });

            it('rejects coordinates without a Z elevation', () => {
              expect(() => parseTerrainProfileGeoJson(JSON.stringify({
                type: 'LineString',
                coordinates: [[0, 0], [0.01, 0]]
              }), 'missing-z.geojson', context)).toThrow('[boylam, enlem, yükseklik]');
            });

            it('rejects repeated consecutive positions', () => {
              expect(() => parseTerrainProfileGeoJson(JSON.stringify({
                type: 'LineString',
                coordinates: [[0, 0, 1], [0, 0, 2]]
              }), 'duplicate.geojson', context)).toThrow('aynı konumu');
            });

            it('rejects FeatureCollections with multiple routes', () => {
              expect(() => parseTerrainProfileGeoJson(JSON.stringify({
                type: 'FeatureCollection',
                features: [
                  { type: 'Feature', properties: {}, geometry: {
                    type: 'LineString', coordinates: [[0, 0, 1], [0.01, 0, 2]]
                  }},
                  { type: 'Feature', properties: {}, geometry: {
                    type: 'LineString', coordinates: [[1, 1, 1], [1.01, 1, 2]]
                  }}
                ]
              }), 'multiple.geojson', context)).toThrow('birden fazla LineString');
            });
          });
          ''')

          write('examples/terrain-profile-wgs84.geojson', r'''
          {
            "type": "Feature",
            "properties": {
              "name": "WGS84 3B arazi profili örneği"
            },
            "geometry": {
              "type": "LineString",
              "coordinates": [
                [28.978400, 41.008200, 4],
                [28.988000, 41.012000, 8],
                [29.002000, 41.020000, 22],
                [29.020000, 41.031000, 12],
                [29.040000, 41.045000, 6],
                [29.060000, 41.058000, 5]
              ]
            }
          }
          ''')

          write('docs/geojson-terrain-profile.md', r'''
          # GeoJSON arazi profili

          Uygulama, WGS84 koordinatları ve yükseklik taşıyan tek bir 3B `LineString`
          geometrisini arazi profiline dönüştürür.

          ## Desteklenen kök yapılar

          - Doğrudan `LineString`
          - Geometrisi `LineString` olan `Feature`
          - Tam olarak bir `LineString` içeren `FeatureCollection`

          Her koordinat şu sırada olmalıdır:

          ```json
          [boylam, enlem, yükseklik_m]
          ```

          Örnek:

          ```json
          {
            "type": "LineString",
            "coordinates": [
              [28.9784, 41.0082, 4],
              [29.0020, 41.0200, 22],
              [29.0600, 41.0580, 5]
            ]
          }
          ```

          ## Hesaplama

          Ardışık koordinatlar arasındaki mesafe WGS84 elipsoidi üzerinde ters jeodezik
          problem çözülerek hesaplanır. Parça mesafeleri toplanır ve iç noktalar toplam
          rota üzerindeki yüzde konumlarına dönüştürülür.

          Koordinatların üçüncü bileşeni zemin yüksekliği olarak kullanılır. Yüksekliğin
          ortometrik mi elipsoidal mı olduğu dosyadan otomatik anlaşılamaz; kullanıcı
          deneyde uygun düşey referansı seçmelidir.

          ## Sınırlar

          - En az 2, en fazla 2.002 koordinat
          - En fazla 5 MB dosya
          - En fazla 20.000 km toplam rota
          - Boylam `-180…180°`, enlem `-90…90°`
          - Yükseklik `-12.000…100.000 m`
          - Ardışık koordinatlar aynı konumda olamaz
          - Birden fazla `LineString` aynı içe aktarmada desteklenmez

          GeoJSON RFC 7946 uyarınca koordinatlar WGS84 boylam/enlem olarak yorumlanır.
          Eski `crs` alanı bulunursa dikkate alınmadığı açık bir uyarıyla bildirilir.
          ''')

          simulator_path = 'src/shared/simulator.ts'
          replace_regex(
              simulator_path,
              r"export interface CsvTerrainProfileSource \{.*?export type TerrainProfileSource = CsvTerrainProfileSource;",
              '''interface BaseTerrainProfileSource {
            fileName: string;
            importedAtIso: string;
            sourceDistanceM: number | null;
            observerEndpointElevationM: number;
            targetEndpointElevationM: number;
            appliedObserverEndpoint: boolean;
            appliedTargetEndpoint: boolean;
            appliedRouteDistance?: boolean;
            modifiedAfterImport: boolean;
          }

          export interface CsvTerrainProfileSource extends BaseTerrainProfileSource {
            kind: 'csv';
            delimiter: CsvTerrainDelimiter;
            distanceUnit: CsvTerrainDistanceUnit;
            rowCount: number;
            distanceColumnHeader: string;
            elevationColumnHeader: string;
          }

          export interface GeoJsonTerrainProfileSource extends BaseTerrainProfileSource {
            kind: 'geojson';
            geometryType: 'LineString';
            coordinateCount: number;
            startLongitudeDeg: number;
            startLatitudeDeg: number;
            endLongitudeDeg: number;
            endLatitudeDeg: number;
            elevationSource: 'coordinate-z';
          }

          export type TerrainProfileSource =
            | CsvTerrainProfileSource
            | GeoJsonTerrainProfileSource;'''
          )
          replace_once(
              simulator_path,
              '''export interface ImportTerrainProfileResult extends FileOperationResult {
            profile?: ImportedTerrainProfile;
            mappingRequest?: TerrainProfileMappingRequest;
          }''',
              '''export interface ImportedGeoJsonTerrainProfile {
            kind: 'geojson';
            fileName: string;
            geometryType: 'LineString';
            coordinateCount: number;
            sourceDistanceM: number;
            startLongitudeDeg: number;
            startLatitudeDeg: number;
            endLongitudeDeg: number;
            endLatitudeDeg: number;
            elevationSource: 'coordinate-z';
            observerEndpointElevationM: number;
            targetEndpointElevationM: number;
            points: ManualTerrainPoint[];
            warnings: string[];
          }

          export type TerrainProfileImport =
            | ImportedTerrainProfile
            | ImportedGeoJsonTerrainProfile;

          export interface ImportTerrainProfileResult extends FileOperationResult {
            profile?: TerrainProfileImport;
            mappingRequest?: TerrainProfileMappingRequest;
          }'''
          )
          replace_once(
              simulator_path,
              '''  importTerrainProfileWithMapping(
            requestId: string,
            mapping: TerrainProfileColumnMapping,
            context: TerrainProfileImportContext
          ): Promise<ImportTerrainProfileResult>;
          }''',
              '''  importTerrainProfileWithMapping(
            requestId: string,
            mapping: TerrainProfileColumnMapping,
            context: TerrainProfileImportContext
          ): Promise<ImportTerrainProfileResult>;
            importGeoJsonTerrainProfile(
              context: TerrainProfileImportContext
            ): Promise<ImportTerrainProfileResult>;
          }'''
          )

          helper_path = 'src/simulation/terrain-import-application.ts'
          replace_once(
              helper_path,
              '  ImportedTerrainProfile,\n  SimulatorInputs',
              '  SimulatorInputs,\n  TerrainProfileImport'
          )
          replace_once(helper_path, 'profile: ImportedTerrainProfile', 'profile: TerrainProfileImport')
          replace_once(helper_path, 'profile: ImportedTerrainProfile', 'profile: TerrainProfileImport')

          preload_path = 'src/preload/index.ts'
          replace_once(preload_path, "  version: '0.8.0',", "  version: '0.9.0',")
          replace_once(
              preload_path,
              '''  ) => ipcRenderer.invoke(
            'terrain:import-csv-mapped',
            requestId,
            mapping,
            context
          ) as Promise<ImportTerrainProfileResult>
          };''',
              '''  ) => ipcRenderer.invoke(
            'terrain:import-csv-mapped',
            requestId,
            mapping,
            context
          ) as Promise<ImportTerrainProfileResult>,
            importGeoJsonTerrainProfile: (context: TerrainProfileImportContext) =>
              ipcRenderer.invoke(
                'terrain:import-geojson',
                context
              ) as Promise<ImportTerrainProfileResult>
          };'''
          )

          main_path = 'src/main/index.ts'
          replace_once(
              main_path,
              "import {\n  parseTerrainProfileCsv,\n  TerrainProfileColumnMappingRequiredError\n} from '../simulation/csv-terrain-profile';",
              "import {\n  parseTerrainProfileCsv,\n  TerrainProfileColumnMappingRequiredError\n} from '../simulation/csv-terrain-profile';\nimport { parseTerrainProfileGeoJson } from '../simulation/geojson-terrain-profile';"
          )
          replace_once(main_path, 'const MAX_TERRAIN_CSV_BYTES = 5 * 1024 * 1024;', 'const MAX_TERRAIN_PROFILE_BYTES = 5 * 1024 * 1024;')
          replace_once(main_path, 'statistics.size > MAX_TERRAIN_CSV_BYTES', 'statistics.size > MAX_TERRAIN_PROFILE_BYTES')
          replace_once(
              main_path,
              "  ipcMain.handle(\n    'experiments:report',",
              '''  ipcMain.handle(
            'terrain:import-geojson',
            async (event, rawContext: unknown): Promise<ImportTerrainProfileResult> => {
              const context = validateTerrainImportContext(rawContext);
              const selection = await showOpenDialog(event, {
                title: 'GeoJSON Arazi Profilini İçe Aktar',
                properties: ['openFile'],
                filters: [
                  { name: 'GeoJSON Arazi Profili', extensions: ['geojson', 'json'] },
                  { name: 'Tüm Dosyalar', extensions: ['*'] }
                ]
              });

              const selectedPath = selection.filePaths[0];
              if (selection.canceled || !selectedPath) {
                return { status: 'cancelled', message: 'GeoJSON profil içe aktarma iptal edildi.' };
              }

              const statistics = await fs.stat(selectedPath);
              if (!statistics.isFile()) throw new Error('Seçilen yol normal bir dosya değil.');
              if (statistics.size > MAX_TERRAIN_PROFILE_BYTES) {
                throw new Error('GeoJSON arazi profili 5 MB sınırını aşıyor.');
              }

              const content = await fs.readFile(selectedPath, 'utf-8');
              const profile = parseTerrainProfileGeoJson(content, selectedPath, context);
              return {
                status: 'success',
                message: `“${profile.fileName}” okundu: ${profile.points.length} ara nokta uygulamaya hazır.`,
                filePath: selectedPath,
                profile
              };
            }
          );

          ipcMain.handle(
            'experiments:report','''
          )

          editor_path = 'src/renderer/src/MultiPointTerrainEditor.tsx'
          replace_once(
              editor_path,
              '''  CsvTerrainDistanceUnit,
            ImportedTerrainProfile,
            TerrainProfileMappingRequest''',
              '''  CsvTerrainDistanceUnit,
            ImportedGeoJsonTerrainProfile,
            TerrainProfileImport,
            TerrainProfileMappingRequest'''
          )
          replace_once(editor_path, 'profile: ImportedTerrainProfile,', 'profile: TerrainProfileImport,')
          replace_once(editor_path, 'const [pendingImport, setPendingImport] = useState<ImportedTerrainProfile>();', 'const [pendingImport, setPendingImport] = useState<TerrainProfileImport>();')
          replace_once(editor_path, 'const stageProfile = (profile: ImportedTerrainProfile): void => {', 'const stageProfile = (profile: TerrainProfileImport): void => {')
          replace_once(
              editor_path,
              '''function distanceUnitLabel(profile: ImportedTerrainProfile): string {
            if (profile.distanceUnit === 'percent') return 'rotanın yüzdesi';
            if (profile.distanceUnit === 'km') return 'kilometre';
            return 'metre';
          }

          function sourceDistanceLabel(profile: ImportedTerrainProfile): string {
            if (profile.sourceDistanceM === null) return 'Konumlar yüzde olarak verilmiş';
            return `${numberFormatter.format(profile.sourceDistanceM / 1_000)} km CSV rotası`;
          }''',
              '''function isGeoJsonProfile(
            profile: TerrainProfileImport
          ): profile is ImportedGeoJsonTerrainProfile {
            return 'kind' in profile && profile.kind === 'geojson';
          }

          function distanceUnitLabel(profile: TerrainProfileImport): string {
            if (isGeoJsonProfile(profile)) return 'WGS84 koordinatları';
            if (profile.distanceUnit === 'percent') return 'rotanın yüzdesi';
            if (profile.distanceUnit === 'km') return 'kilometre';
            return 'metre';
          }

          function sourceDistanceLabel(profile: TerrainProfileImport): string {
            if (profile.sourceDistanceM === null) return 'Konumlar yüzde olarak verilmiş';
            const sourceLabel = isGeoJsonProfile(profile) ? 'GeoJSON rotası' : 'CSV rotası';
            return `${numberFormatter.format(profile.sourceDistanceM / 1_000)} km ${sourceLabel}`;
          }'''
          )
          replace_once(
              editor_path,
              '''  const chooseCsvProfile = async (): Promise<void> => {''',
              '''  const chooseGeoJsonProfile = async (): Promise<void> => {
            setOperationError('');
            setImportMessage('');
            setIsImporting(true);
