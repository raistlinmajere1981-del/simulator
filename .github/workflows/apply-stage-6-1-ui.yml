name: Apply stage 6.1 UI patch

on:
  push:
    branches:
      - agent/solar-position
    paths:
      - scripts/apply_stage_6_1_ui.py
      - .github/workflows/apply-stage-6-1-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/solar-position
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_stage_6_1_ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate stage 6.1 solar observation workflow"
          git push origin HEAD:agent/solar-position
