name: Apply stage 5.4 UI patch

on:
  push:
    branches:
      - agent/photo-model-uncertainty
    paths:
      - scripts/apply_stage_5_4_ui.py
      - .github/workflows/apply-stage-5-4-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/photo-model-uncertainty
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_stage_5_4_ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate stage 5.4 uncertainty workflow"
          git push origin HEAD:agent/photo-model-uncertainty
