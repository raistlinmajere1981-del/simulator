name: Numeric Input UX Fix

on:
  push:
    branches:
      - agent/stellar-local-horizon-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stellar-local-horizon-ui
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded UX patch and scan
        run: node scripts/apply-numeric-input-ux-fix.mjs
      - name: Check diff
        run: git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          if git diff --quiet -- src/renderer/src/AppNext.tsx src/renderer/src/stellar-observation-panel.css src/renderer/src/MultiPointTerrainEditor.tsx; then
            echo "No product change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/AppNext.tsx src/renderer/src/stellar-observation-panel.css src/renderer/src/MultiPointTerrainEditor.tsx
          git commit -m "Sayısal girişleri taslak düzenleme akışına taşı"
          git push origin HEAD:agent/stellar-local-horizon-ui
