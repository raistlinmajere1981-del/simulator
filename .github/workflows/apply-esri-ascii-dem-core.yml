name: Validate strict ESRI ASCII origins

on:
  push:
    branches:
      - agent/esri-ascii-dem-core
    paths:
      - .github/workflows/apply-esri-ascii-dem-core.yml
      - scripts/tighten-esri-ascii-origin.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esri-ascii-dem-core
          fetch-depth: 0

      - name: Tighten origin validation
        run: python3 scripts/tighten-esri-ascii-origin.py

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary patch script
        run: rm -f scripts/tighten-esri-ascii-origin.py

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "reject partial or mixed ESRI ASCII origins"
          git push origin HEAD:agent/esri-ascii-dem-core
