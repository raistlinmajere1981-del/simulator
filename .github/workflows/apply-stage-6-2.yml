name: Apply stage 6.2 integration
on:
  push:
    branches: [agent/lunar-position]
    paths:
      - scripts/apply_stage_6_2.py
      - .github/workflows/apply-stage-6-2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lunar-position
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_stage_6_2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate lunar position and phase workflow"
          git push origin HEAD:agent/lunar-position
