name: Stage 6.21 guarded patch

on:
  push:
    branches:
      - agent/stellar-sky-ui
    paths:
      - .github/scripts/apply-stage-6.21.mjs
      - .github/workflows/stage-6.21-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stellar-sky-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Escape JSX template expressions inside temporary patch payload
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-stage-6.21.mjs')
          text = path.read_text()
          start = text.index('const skyPanel = `')
          end = text.index('`;\nreplaceOnce(', start)
          segment = text[start:end]
          segment = segment.replace('${', '\\${')
          path.write_text(text[:start] + segment + text[end:])
          PY
      - name: Apply guarded product patch
        run: node .github/scripts/apply-stage-6.21.mjs
      - name: Validate diff and commit product files only
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/simulation/stellar-observation.ts src/renderer/src/StellarObservationPanel.tsx src/renderer/src/stellar-observation-panel.css
          git diff --cached --quiet && exit 0
          git commit -m "Aşama 6.21 çoklu yıldız gökyüzü görünümünü bağla"
          git push origin HEAD:agent/stellar-sky-ui
