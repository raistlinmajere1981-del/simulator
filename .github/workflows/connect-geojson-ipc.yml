name: Connect GeoJSON IPC flow

on:
  push:
    branches:
      - agent/geojson-terrain-profile-import
    paths:
      - .github/workflows/connect-geojson-ipc.yml
      - scripts/connect-geojson-ipc.py
      - scripts/add-geojson-api.py

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geojson-terrain-profile-import
          fetch-depth: 0

      - name: Apply IPC connection
        run: |
          python3 scripts/connect-geojson-ipc.py
          python3 scripts/add-geojson-api.py

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary patch scripts
        run: rm -f scripts/connect-geojson-ipc.py scripts/add-geojson-api.py

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "connect GeoJSON import through Electron IPC"
          git push origin HEAD:agent/geojson-terrain-profile-import
