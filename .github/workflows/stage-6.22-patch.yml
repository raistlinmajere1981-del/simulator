name: Stage 6.22 guarded patch

on:
  push:
    branches:
      - agent/stellar-proper-motion-application
    paths:
      - .github/workflows/stage-6.22-patch.yml
      - .github/scripts/apply-stage-6.22.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stellar-proper-motion-application
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded product patch
        run: node .github/scripts/apply-stage-6.22.mjs
      - name: Validate diff and commit product files only
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/simulation/bright-star-catalog.ts src/simulation/bsc5p-motion-subset.ts src/simulation/stellar-sky-snapshot.ts src/simulation/stellar-observation.ts
          git diff --cached --quiet && exit 1
          git commit -m "Aşama 6.22 doğrulanmış proper motion kaynağını hesap zincirine bağla"
          git push origin HEAD:agent/stellar-proper-motion-application
