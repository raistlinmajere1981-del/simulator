name: Apply geoid UI wiring

on:
  push:
    branches:
      - agent/geoid-conversion-ui
    paths:
      - scripts/apply-geoid-ui.py
      - .github/workflows/apply-geoid-ui.yml

permissions:
  contents: write

concurrency:
  group: apply-geoid-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/geoid-conversion-ui
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded source patch
        run: python3 scripts/apply-geoid-ui.py

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated product changes
        run: |
          rm -f scripts/apply-geoid-ui.py .github/workflows/apply-geoid-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire controlled geoid conversion into terrain panel"
          git push origin HEAD:agent/geoid-conversion-ui
