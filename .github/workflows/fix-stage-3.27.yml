name: Fix stage 3.27 scenarios

on:
  push:
    branches:
      - agent/scenario-horizon-long-distance
    paths:
      - scripts/fix_stage_3_27.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scenario-horizon-long-distance
          fetch-depth: 0
      - name: Apply fixes
        run: python scripts/fix_stage_3_27.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/AppNext.tsx
          if git diff --cached --quiet; then
            echo "No fix required"
            exit 0
          fi
          git commit -m "fix: tighten scenario UI typing and state"
          git push origin HEAD:agent/scenario-horizon-long-distance
