name: Apply ESRI ASCII DEM route profile

on:
  push:
    branches:
      - agent/esri-ascii-dem-route-profile
    paths:
      - .github/workflows/apply-dem-route-core.yml
      - scripts/apply-dem-route-core.py
      - scripts/fix-dem-report-union.py
      - scripts/apply-dem-route-integration.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esri-ascii-dem-route-profile
          fetch-depth: 0

      - name: Apply product changes
        run: |
          python3 scripts/apply-dem-route-core.py
          python3 scripts/fix-dem-report-union.py
          python3 scripts/apply-dem-route-integration.py

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary patch scripts
        run: rm -f scripts/apply-dem-route-core.py scripts/fix-dem-report-union.py scripts/apply-dem-route-integration.py

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "add ESRI ASCII DEM route profile flow"
          git push origin HEAD:agent/esri-ascii-dem-route-profile
