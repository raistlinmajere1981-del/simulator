name: Stage 6.23 roadmap update

on:
  push:
    branches:
      - agent/stellar-motion-source-ui
    paths:
      - .github/workflows/update-roadmap-stage-6.23.yml
      - .github/scripts/update-roadmap-stage-6.23.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stellar-motion-source-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/update-roadmap-stage-6.23.mjs
      - name: Validate and commit roadmap only
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md
          git diff --cached --quiet && exit 1
          git commit -m "Roadmapı Aşama 6.23 durumuyla güncelle"
          git push origin HEAD:agent/stellar-motion-source-ui
