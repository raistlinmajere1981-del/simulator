name: Apply stage 4.3 integration v2

on:
  push:
    branches:
      - agent/atmosphere-ui-integration
    paths:
      - scripts/prepare_stage_4_3.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atmosphere-ui-integration
          fetch-depth: 0
      - run: python scripts/prepare_stage_4_3.py
      - run: python scripts/apply_stage_4_3.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/simulator.ts src/shared/portable.ts src/renderer/src/AppNext.tsx package.json README.md docs/roadmap.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate persisted atmosphere profile UI"
          git push origin HEAD:agent/atmosphere-ui-integration
