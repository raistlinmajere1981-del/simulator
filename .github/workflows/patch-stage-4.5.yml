name: Patch stage 4.5 visualization

on:
  push:
    branches:
      - agent/atmosphere-profile-visualization
    paths:
      - scripts/patch_stage_4_5.py
      - .github/workflows/patch-stage-4.5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atmosphere-profile-visualization
      - run: python scripts/patch_stage_4_5.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/AppNext.tsx src/renderer/src/WorldModelViewport.tsx src/renderer/src/world-model-viewport.css package.json
          git diff --cached --quiet || git commit -m "Aşama 4.5 atmosfer görsel katmanını arayüze bağla"
          git push origin HEAD:agent/atmosphere-profile-visualization
