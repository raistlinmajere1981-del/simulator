name: Execute GeoJSON product implementation

on:
  push:
    branches:
      - agent/geojson-terrain-profile-import
    paths:
      - .github/workflows/execute-geojson-product.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geojson-terrain-profile-import
          fetch-depth: 0

      - name: Apply GeoJSON product changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          retry_path = Path('.github/workflows/retry-geojson-terrain-profile.yml')
          raw = retry_path.read_text(encoding='utf-8')
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = raw.index(marker_start) + len(marker_start)
          end = raw.index(marker_end, start)
          code = textwrap.dedent(raw[start:end])

          lines = code.splitlines()
          matches = [i for i, line in enumerate(lines) if 'app_section_start = script.index' in line]
          if len(matches) != 1:
              raise RuntimeError(f'Expected one AppNext marker, found {len(matches)}')
          index = matches[0]
          lines[index:index + 3] = [
              "app_block_end = script.index(\"\\n\\nportable_path = 'src/shared/portable.ts'\")",
              "app_block_start = script.rfind(\"replace_regex(\", 0, app_block_end)",
              "if app_block_start < 0:",
              "    raise RuntimeError('AppNext source replacement block not found')"
          ]

          call_matches = [i for i, line in enumerate(lines) if line == 'app_replacement_call = (']
          if len(call_matches) != 1:
              raise RuntimeError(f'Expected one AppNext replacement call, found {len(call_matches)}')
          lines.insert(
              call_matches[0] + 1,
              "    \"app_path = 'src/renderer/src/AppNext.tsx'\\n\""
          )

          exec_matches = [
              i for i, line in enumerate(lines)
              if line == "exec(compile(script, 'geojson-stage.py', 'exec'))"
          ]
          if len(exec_matches) != 1:
              raise RuntimeError(f'Expected one nested product exec, found {len(exec_matches)}')
          exec_index = exec_matches[0]

          portable_replacement_source = '\n'.join([
              "portable_text = read(portable_path)",
              "if portable_text.count('PortableExperimentFileV5') != 2:",
              "    raise RuntimeError('Unexpected PortableExperimentFileV5 count')",
              "if portable_text.count('LocalExperimentStoreV5') != 3:",
              "    raise RuntimeError('Unexpected LocalExperimentStoreV5 count')",
              "portable_text = portable_text.replace('PortableExperimentFileV5', 'PortableExperimentFileV6')",
              "portable_text = portable_text.replace('LocalExperimentStoreV5', 'LocalExperimentStoreV6')",
              "Path(portable_path).write_text(portable_text, encoding='utf-8')"
          ])
          version_replacement_source = '\n'.join([
              "portable_text = read(portable_path)",
              "portable_old = '  if (version !== 1 && version !== 2 && version !== 3 && version !== 4 &&\\n    version !== PORTABLE_EXPERIMENT_SCHEMA_VERSION) {'",
              "portable_new = '  if (version !== 1 && version !== 2 && version !== 3 && version !== 4 &&\\n    version !== 5 && version !== PORTABLE_EXPERIMENT_SCHEMA_VERSION) {'",
              "local_old = '  if (version !== 1 && version !== 2 && version !== 3 && version !== 4 &&\\n    version !== LOCAL_EXPERIMENT_STORE_SCHEMA_VERSION) {'",
              "local_new = '  if (version !== 1 && version !== 2 && version !== 3 && version !== 4 &&\\n    version !== 5 && version !== LOCAL_EXPERIMENT_STORE_SCHEMA_VERSION) {'",
              "if portable_text.count(portable_old) != 1:",
              "    raise RuntimeError('Unexpected portable version condition')",
              "if portable_text.count(local_old) != 1:",
              "    raise RuntimeError('Unexpected local version condition')",
              "portable_text = portable_text.replace(portable_old, portable_new).replace(local_old, local_new)",
              "Path(portable_path).write_text(portable_text, encoding='utf-8')"
          ])
          portable_test_replacement_source = '\n'.join([
              "portable_test_text = read(portable_test)",
              "old_assertion = 'expect(parsed.store.schemaVersion).toBe(5);'",
              "new_assertion = 'expect(parsed.store.schemaVersion).toBe(PORTABLE_EXPERIMENT_SCHEMA_VERSION);'",
              "if portable_test_text.count(old_assertion) != 2:",
              "    raise RuntimeError('Unexpected portable store schema assertion count')",
              "Path(portable_test).write_text(",
              "    portable_test_text.replace(old_assertion, new_assertion),",
              "    encoding='utf-8'",
              ")"
          ])

          nested_patch = [
              "portable_pattern = (",
              "    r\"replace_once\\(\\s*portable_path,\\s*'PortableExperimentFileV5',\\s*\"",
              "    r\"'PortableExperimentFileV6'\\s*\\)\\s*\"",
              "    r\"replace_once\\(\\s*portable_path,\\s*'LocalExperimentStoreV5',\\s*\"",
              "    r\"'LocalExperimentStoreV6'\\s*\\)\\s*\"",
              "    r\"replace_once\\(\\s*portable_path,\\s*'PortableExperimentFileV5',\\s*\"",
              "    r\"'PortableExperimentFileV6'\\s*\\)\\s*\"",
              "    r\"replace_once\\(\\s*portable_path,\\s*'LocalExperimentStoreV5',\\s*\"",
              "    r\"'LocalExperimentStoreV6'\\s*\\)\"",
              ")",
              f"portable_replacement = {portable_replacement_source!r}",
              "script, portable_count = re.subn(",
              "    portable_pattern, lambda _match: portable_replacement, script, count=1, flags=re.S",
              ")",
              "if portable_count != 1:",
              "    raise RuntimeError(f'Expected one portable type migration block, found {portable_count}')",
              "version_calls_pattern = (",
              "    r\"replace_once\\(\\s*portable_path,\\s*'''  if \\(version !== 1.*?\"",
              "    r\"PORTABLE_EXPERIMENT_SCHEMA_VERSION\\) \\{''',\\s*'''  if \\(version !== 1.*?\"",
              "    r\"PORTABLE_EXPERIMENT_SCHEMA_VERSION\\) \\{'''\\s*\\)\\s*\"",
              "    r\"replace_once\\(\\s*portable_path,\\s*'''  if \\(version !== 1.*?\"",
              "    r\"LOCAL_EXPERIMENT_STORE_SCHEMA_VERSION\\) \\{''',\\s*'''  if \\(version !== 1.*?\"",
              "    r\"LOCAL_EXPERIMENT_STORE_SCHEMA_VERSION\\) \\{'''\\s*\\)\"",
              ")",
              f"version_calls_replacement = {version_replacement_source!r}",
              "script, version_calls_count = re.subn(",
              "    version_calls_pattern, lambda _match: version_calls_replacement, script, count=1, flags=re.S",
              ")",
              "if version_calls_count != 1:",
              "    raise RuntimeError(f'Expected one portable version migration block, found {version_calls_count}')",
              "portable_test_calls_pattern = (",
              "    r\"replace_once\\(\\s*portable_test,\\s*'expect\\(parsed\\.store\\.schemaVersion\\)\\.toBe\\(5\\);',\\s*\"",
              "    r\"'expect\\(parsed\\.store\\.schemaVersion\\)\\.toBe\\(PORTABLE_EXPERIMENT_SCHEMA_VERSION\\);'\\s*\\)\\s*\"",
              "    r\"replace_once\\(\\s*portable_test,\\s*'expect\\(parsed\\.store\\.schemaVersion\\)\\.toBe\\(5\\);',\\s*\"",
              "    r\"'expect\\(parsed\\.store\\.schemaVersion\\)\\.toBe\\(PORTABLE_EXPERIMENT_SCHEMA_VERSION\\);'\\s*\\)\"",
              ")",
              f"portable_test_calls_replacement = {portable_test_replacement_source!r}",
              "script, portable_test_calls_count = re.subn(",
              "    portable_test_calls_pattern, lambda _match: portable_test_calls_replacement, script, count=1, flags=re.S",
              ")",
              "if portable_test_calls_count != 1:",
              "    raise RuntimeError(f'Expected one repeated portable assertion block, found {portable_test_calls_count}')",
              ""
          ]
          lines[exec_index:exec_index] = nested_patch

          exec(compile('\n'.join(lines) + '\n', 'geojson-retry.py', 'exec'))
          PY

      - name: Preserve workflow files
        run: git restore --source=HEAD -- .github/workflows

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "add GeoJSON terrain profile import"
          git push origin HEAD:agent/geojson-terrain-profile-import
