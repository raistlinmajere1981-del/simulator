name: Patch 6.25 main wiring

on:
  push:
    branches:
      - agent/dem-skyline-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dem-skyline-ui
      - name: Apply guarded main wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main/index.ts')
          text = path.read_text()
          old_import = """import {
            attachTerrainSourceIntegrity,
            calculateTerrainSourceIntegrity
          } from './terrain-source-integrity';
          """
          new_import = old_import + "import { registerStellarDemSkylineHandlers } from './stellar-dem-skyline-ipc';\n"
          if text.count(old_import) != 1:
              raise SystemExit(f'main import anchor count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)
          old_register = """function registerExperimentHandlers(): void {
            ipcMain.handle('experiments:list', async () => readExperiments());
          """
          new_register = """function registerExperimentHandlers(): void {
            registerStellarDemSkylineHandlers();
            ipcMain.handle('experiments:list', async () => readExperiments());
          """
          if text.count(old_register) != 1:
              raise SystemExit(f'main register anchor count={text.count(old_register)}')
          path.write_text(text.replace(old_register, new_register, 1))
          PY
      - name: Commit protected patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Wire staged DEM skyline IPC"
          git push origin HEAD:agent/dem-skyline-ui
