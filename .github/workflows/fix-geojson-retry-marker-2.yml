name: Apply YAML-safe GeoJSON retry marker fix

on:
  push:
    branches:
      - agent/geojson-terrain-profile-import
    paths:
      - .github/workflows/fix-geojson-retry-marker-2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geojson-terrain-profile-import
          fetch-depth: 0

      - name: Replace section marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/retry-geojson-terrain-profile.yml')
          text = path.read_text(encoding='utf-8')
          old = "\n".join([
              "          app_section_start = script.index(\"app_path = 'src/renderer/src/AppNext.tsx'\")",
              "          app_block_start = script.index(\"replace_regex(\\\\n    app_path,\", app_section_start)",
              "          app_block_end = script.index(\"\\\\n\\\\nportable_path = 'src/shared/portable.ts'\", app_block_start)",
              ""
          ])
          new = "\n".join([
              "          app_block_end = script.index(\"\\\\n\\\\nportable_path = 'src/shared/portable.ts'\")",
              "          app_block_start = script.rfind(\"replace_regex(\", 0, app_block_end)",
              "          if app_block_start < 0:",
              "              raise RuntimeError('AppNext source replacement block not found')",
              ""
          ])
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'Expected one marker block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-geojson-retry-marker.yml').unlink(missing_ok=True)
          Path('.github/workflows/fix-geojson-retry-marker-2.yml').unlink()
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix GeoJSON retry AppNext marker"
          git push origin HEAD:agent/geojson-terrain-profile-import
