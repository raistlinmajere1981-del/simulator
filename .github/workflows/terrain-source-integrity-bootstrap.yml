name: Validate terrain source integrity branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/terrain-source-integrity-bootstrap.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terrain-source-integrity
          fetch-depth: 0

      - name: Apply product changes
        run: python3 scripts/apply-terrain-source-integrity.py

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary branch files
        run: rm -f scripts/apply-terrain-source-integrity.py .github/workflows/apply-terrain-source-integrity.yml

      - name: Commit product changes to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "record terrain source file integrity"
          git push origin HEAD:agent/terrain-source-integrity
