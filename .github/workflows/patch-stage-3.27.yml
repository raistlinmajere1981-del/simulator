name: Patch stage 3.27 scenarios

on:
  push:
    branches:
      - agent/scenario-horizon-long-distance
    paths:
      - scripts/patch_stage_3_27.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scenario-horizon-long-distance
          fetch-depth: 0
      - name: Apply scenario patch
        run: python scripts/patch_stage_3_27.py
      - name: Commit scenario implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests package.json README.md docs
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "feat: add horizon and long-distance scenarios"
          git push origin HEAD:agent/scenario-horizon-long-distance
