name: Normalize Stellar Settings 6.15

on:
  push:
    branches:
      - agent/stellar-local-horizon-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stellar-local-horizon-ui
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: node scripts/normalize-stellar-settings-6.15.mjs
      - name: Check diff
        run: git diff --check
      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet -- src/simulation/stellar-observation.ts; then
            echo "No source change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/stellar-observation.ts
          git commit -m "6.15 eski yıldız ayarlarını güvenli varsayılanlarla normalize et"
          git push origin HEAD:agent/stellar-local-horizon-ui
