name: Fix stage 5.4 core types
on:
  push:
    branches: [agent/photo-model-uncertainty]
    paths:
      - scripts/fix_stage_5_4_core_types.py
      - .github/workflows/fix-stage-5-4-core-types.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/photo-model-uncertainty
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_stage_5_4_core_types.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct stage 5.4 uncertainty types"
          git push origin HEAD:agent/photo-model-uncertainty
