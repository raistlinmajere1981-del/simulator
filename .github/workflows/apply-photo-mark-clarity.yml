name: Apply photo mark clarity fix

on:
  push:
    branches:
      - agent/photo-mark-label-clarity
    paths:
      - scripts/apply_photo_mark_clarity.py
      - .github/workflows/apply-photo-mark-clarity.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/photo-mark-label-clarity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_photo_mark_clarity.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clarify photo target marks and reject inverted calibration"
          git push origin HEAD:agent/photo-mark-label-clarity
