name: Patch stage 5.2 integration

on:
  push:
    branches:
      - agent/photo-calibration-ui
    paths:
      - scripts/patch_stage_5_2.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/photo-calibration-ui
          fetch-depth: 0
      - run: python scripts/patch_stage_5_2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate photo calibration with desktop experiments"
          git push origin HEAD:agent/photo-calibration-ui
