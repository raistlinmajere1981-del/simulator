name: Fix stage 4.4 typing

on:
  push:
    branches:
      - agent/layered-atmosphere-ideal-sphere
    paths:
      - scripts/fix_stage_4_4_types.py
      - .github/workflows/fix-stage-4.4.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/layered-atmosphere-ideal-sphere
      - run: python scripts/fix_stage_4_4_types.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/layered-sphere-visibility.ts
          git diff --cached --quiet || git commit -m "fix: narrow layered target ray root types"
          git push origin HEAD:agent/layered-atmosphere-ideal-sphere
