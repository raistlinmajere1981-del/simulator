name: Patch 6.27 source kind
on:
  push:
    branches: [agent/panorama-skyline-ui]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panorama-skyline-ui
      - name: Apply guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/simulation/stellar-observation.ts')
          s = p.read_text()
          changes = [
            ("export interface StellarObservationLocalHorizonSourceSummary {\n  mode: StellarLocalHorizonSourceMode;", "export interface StellarObservationLocalHorizonSourceSummary {\n  mode: StellarLocalHorizonSourceMode;\n  sourceKind: StellarLocalHorizonMask['sourceKind'];"),
            ("        mode: 'manual',\n        label: normalized.sourceLabel,", "        mode: 'manual',\n        sourceKind: normalized.sourceKind,\n        label: normalized.sourceLabel,"),
            ("      mode: 'external',\n      label: source.fileName,", "      mode: 'external',\n      sourceKind: normalized.sourceKind,\n      label: source.fileName,")
          ]
          for old, new in changes:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'anchor count={count}: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/simulation/stellar-observation.ts
          git commit -m "Expose local skyline source kind in stellar trace"
          git push origin HEAD:agent/panorama-skyline-ui
