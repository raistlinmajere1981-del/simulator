name: Fix Stellar Skyline Warning Condition
on:
  push:
    branches:
      - agent/stellar-skyline-import-ui
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stellar-skyline-import-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-warning-condition.mjs
      - run: git diff --check
      - shell: bash
        run: |
          if git diff --quiet -- src/renderer/src/StellarObservationPanel.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/StellarObservationPanel.tsx
          git commit -m "Skyline uyarı koşulunu TypeScript için daralt"
          git push origin HEAD:agent/stellar-skyline-import-ui
