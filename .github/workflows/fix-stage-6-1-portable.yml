name: Fix stage 6.1 portable typing

on:
  push:
    branches: [agent/solar-position]
    paths:
      - scripts/fix_stage_6_1_portable.py
      - .github/workflows/fix-stage-6-1-portable.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/solar-position
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_stage_6_1_portable.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate celestial observation offset safely"
          git push origin HEAD:agent/solar-position
