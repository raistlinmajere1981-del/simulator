name: Roadmap 6.16 6.17 Patch

on:
  push:
    branches:
      - agent/stellar-skyline-import-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stellar-skyline-import-ui
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded roadmap patch
        run: node scripts/apply-roadmap-6-16-17.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          if git diff --quiet -- docs/roadmap.md; then
            echo "No product change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md
          git commit -m "Roadmap'e Aşama 6.16 ve 6.17 durumlarını ekle"
          git push origin HEAD:agent/stellar-skyline-import-ui
