name: Patch 6.25 stellar observation

on:
  push:
    branches:
      - agent/dem-skyline-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dem-skyline-ui
      - name: Apply guarded stellar observation patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/simulation/stellar-observation.ts')
          text = path.read_text()

          old_version = "export const STELLAR_OBSERVATION_MODEL_VERSION = '0.6.0';"
          if text.count(old_version) != 1:
              raise SystemExit('stellar model version anchor mismatch')
          text = text.replace(old_version, "export const STELLAR_OBSERVATION_MODEL_VERSION = '0.7.0';", 1)

          old_summary = '''export interface StellarObservationLocalHorizonSourceSummary {
            mode: StellarLocalHorizonSourceMode;
            label: string;
            pointCount: number;
            maximumAzimuthGapDeg: number;
            fileName?: string;
            fileSizeBytes?: number;
            sha256?: string;
            importedAtIso?: string;
            warnings: string[];
          }
          '''
          new_summary = '''export interface StellarObservationLocalHorizonSourceSummary {
            mode: StellarLocalHorizonSourceMode;
            label: string;
            pointCount: number;
            maximumAzimuthGapDeg: number;
            fileName?: string;
            fileSizeBytes?: number;
            sha256?: string;
            importedAtIso?: string;
            format?: SavedStellarLocalHorizonSource['format'];
            demDerivation?: SavedStellarLocalHorizonSource['demDerivation'];
            warnings: string[];
          }
          '''
          if text.count(old_summary) != 1:
              raise SystemExit(f'summary anchor count={text.count(old_summary)}')
          text = text.replace(old_summary, new_summary, 1)

          old_mask = '''function localHorizonMaskFromExternal(source: SavedStellarLocalHorizonSource): StellarLocalHorizonMask {
            return {
              sourceKind: 'external',
              sourceLabel: source.fileName,
              points: source.points.map((point) => ({ ...point }))
            };
          }
          '''
          new_mask = '''function localHorizonMaskFromExternal(source: SavedStellarLocalHorizonSource): StellarLocalHorizonMask {
            return {
              sourceKind: source.format === 'dem' ? 'derived' : 'external',
              sourceLabel: source.fileName,
              points: source.points.map((point) => ({ ...point }))
            };
          }
          '''
          if text.count(old_mask) != 1:
              raise SystemExit(f'mask anchor count={text.count(old_mask)}')
          text = text.replace(old_mask, new_mask, 1)

          old_external_summary = '''      fileName: source.fileName,
                fileSizeBytes: source.fileSizeBytes,
                sha256: source.sha256,
                importedAtIso: source.importedAtIso,
                warnings: [...source.warnings]
          '''
          new_external_summary = '''      fileName: source.fileName,
                fileSizeBytes: source.fileSizeBytes,
                sha256: source.sha256,
                importedAtIso: source.importedAtIso,
                format: source.format,
                ...(source.demDerivation ? { demDerivation: { ...source.demDerivation } } : {}),
                warnings: [...source.warnings]
          '''
          if text.count(old_external_summary) != 1:
              raise SystemExit(f'external summary anchor count={text.count(old_external_summary)}')
          text = text.replace(old_external_summary, new_external_summary, 1)

          old_warning = '''  const localHorizonWarning = !settings.localHorizonEnabled
              ? 'Yerel/topoğrafik ufuk kapalıdır; geometrik görünürlük yalnız 0° astronomik ufuk anlamındadır.'
              : localHorizon.summary?.mode === 'external'
                ? `Dış yerel skyline uygulanır: ${localHorizon.summary.fileName}; ${localHorizon.summary.pointCount} nokta; maksimum azimut boşluğu=${format(localHorizon.summary.maximumAzimuthGapDeg, 3)}°; SHA-256=${localHorizon.summary.sha256}.`
                : 'Sekiz yönlü manuel yerel skyline maskesi geometrik yıldız izine uygulanır; ara azimutlar döngüsel doğrusal interpolasyonla çözülür.';
          '''
          new_warning = '''  const localHorizonWarning = !settings.localHorizonEnabled
              ? 'Yerel/topoğrafik ufuk kapalıdır; geometrik görünürlük yalnız 0° astronomik ufuk anlamındadır.'
              : localHorizon.summary?.format === 'dem' && localHorizon.summary.demDerivation
                ? `DEM'den türetilmiş geometrik skyline uygulanır: ${localHorizon.summary.fileName}; ${localHorizon.summary.pointCount} nokta; ΔA=${format(localHorizon.summary.demDerivation.azimuthStepDeg, 3)}°; Δs=${format(localHorizon.summary.demDerivation.distanceStepM, 1)} m; s_max=${format(localHorizon.summary.demDerivation.maximumDistanceM / 1_000, 2)} km; SHA-256=${localHorizon.summary.sha256}.`
                : localHorizon.summary?.mode === 'external'
                  ? `Dış yerel skyline uygulanır: ${localHorizon.summary.fileName}; ${localHorizon.summary.pointCount} nokta; maksimum azimut boşluğu=${format(localHorizon.summary.maximumAzimuthGapDeg, 3)}°; SHA-256=${localHorizon.summary.sha256}.`
                  : 'Sekiz yönlü manuel yerel skyline maskesi geometrik yıldız izine uygulanır; ara azimutlar döngüsel doğrusal interpolasyonla çözülür.';
          '''
          if text.count(old_warning) != 1:
              raise SystemExit(f'warning anchor count={text.count(old_warning)}')
          text = text.replace(old_warning, new_warning, 1)

          path.write_text(text)
          PY
      - name: Commit protected patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/simulation/stellar-observation.ts
          git diff --cached --quiet && exit 0
          git commit -m "Mark DEM skyline as derived stellar horizon"
          git push origin HEAD:agent/dem-skyline-ui
