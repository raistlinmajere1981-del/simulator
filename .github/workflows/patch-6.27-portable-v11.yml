name: Patch 6.27 portable v11
on:
  push:
    branches: [agent/panorama-skyline-ui]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panorama-skyline-ui
      - name: Apply guarded portable v11 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/shared/portable.ts')
          s = p.read_text()

          def once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'anchor count={s.count(old)} for {old[:100]!r}')
              s = s.replace(old, new, 1)

          once(
            "import type { SavedStellarDemSkylineDerivation, SavedStellarLocalHorizonSource } from './stellar-local-horizon-import';",
            "import type {\n  SavedStellarDemSkylineDerivation,\n  SavedStellarLocalHorizonSource,\n  SavedStellarPanoramaSkylineDerivation,\n  StellarPanoramaGeometry\n} from './stellar-local-horizon-import';"
          )
          once(
            "import { normalizeStellarLocalHorizonMask } from '../simulation/stellar-local-horizon';",
            "import { normalizeStellarLocalHorizonMask } from '../simulation/stellar-local-horizon';\nimport {\n  EQUIRECTANGULAR_PANORAMA_ALGORITHM_ID,\n  EQUIRECTANGULAR_PANORAMA_ALGORITHM_VERSION,\n  panoramaPixelToLocalDirection,\n  validateEquirectangularPanoramaGeometry\n} from '../simulation/equirectangular-panorama';"
          )
          once('export const PORTABLE_EXPERIMENT_SCHEMA_VERSION = 10;', 'export const PORTABLE_EXPERIMENT_SCHEMA_VERSION = 11;')
          once('export const LOCAL_EXPERIMENT_STORE_SCHEMA_VERSION = 10;', 'export const LOCAL_EXPERIMENT_STORE_SCHEMA_VERSION = 11;')
          s = s.replace('PortableExperimentFileV10', 'PortableExperimentFileV11')
          s = s.replace('LocalExperimentStoreV10', 'LocalExperimentStoreV11')

          helper = r'''function parseStellarPanoramaGeometry(value: unknown): StellarPanoramaGeometry | null {
            if (!isRecord(value) ||
              !Number.isInteger(value.imageWidthPx) || !inRange(value.imageWidthPx, 1, 200_000) ||
              !Number.isInteger(value.imageHeightPx) || !inRange(value.imageHeightPx, 1, 200_000) ||
              !Number.isInteger(value.fullPanoWidthPx) || !inRange(value.fullPanoWidthPx, 1, 200_000) ||
              !Number.isInteger(value.fullPanoHeightPx) || !inRange(value.fullPanoHeightPx, 1, 200_000) ||
              !Number.isInteger(value.croppedAreaLeftPx) || !inRange(value.croppedAreaLeftPx, 0, 200_000) ||
              !Number.isInteger(value.croppedAreaTopPx) || !inRange(value.croppedAreaTopPx, 0, 200_000) ||
              !inRange(value.poseHeadingDeg, 0, 360) || value.poseHeadingDeg === 360 ||
              !inRange(value.posePitchDeg, -90, 90) ||
              !isFiniteNumber(value.poseRollDeg) || value.poseRollDeg <= -180 || value.poseRollDeg > 180) {
              return null;
            }
            const geometry: StellarPanoramaGeometry = {
              imageWidthPx: value.imageWidthPx,
              imageHeightPx: value.imageHeightPx,
              fullPanoWidthPx: value.fullPanoWidthPx,
              fullPanoHeightPx: value.fullPanoHeightPx,
              croppedAreaLeftPx: value.croppedAreaLeftPx,
              croppedAreaTopPx: value.croppedAreaTopPx,
              poseHeadingDeg: value.poseHeadingDeg,
              posePitchDeg: value.posePitchDeg,
              poseRollDeg: value.poseRollDeg
            };
            try {
              validateEquirectangularPanoramaGeometry(geometry);
            } catch {
              return null;
            }
            return geometry;
          }

          function parseStellarPanoramaSkylineDerivation(
            value: unknown,
            sourcePoints: SavedStellarLocalHorizonSource['points'],
            pointCount: number,
            maximumAzimuthGapDeg: number
          ): SavedStellarPanoramaSkylineDerivation | null {
            if (!isRecord(value) ||
              value.algorithmId !== EQUIRECTANGULAR_PANORAMA_ALGORITHM_ID ||
              value.algorithmVersion !== EQUIRECTANGULAR_PANORAMA_ALGORITHM_VERSION ||
              (value.geometrySource !== 'gpano-xmp' && value.geometrySource !== 'manual') ||
              (value.metadataStatusAtImport !== 'complete' && value.metadataStatusAtImport !== 'absent' &&
                value.metadataStatusAtImport !== 'incomplete' &&
                value.metadataStatusAtImport !== 'unsupported-projection' &&
                value.metadataStatusAtImport !== 'incompatible-scale') ||
              (value.projectionTypeAtImport !== undefined &&
                (!isNonEmptyString(value.projectionTypeAtImport) || value.projectionTypeAtImport.length > 100)) ||
              typeof value.metadataScaledToImage !== 'boolean' ||
              typeof value.standardXmpPacketFound !== 'boolean' ||
              typeof value.extendedXmpPacketFound !== 'boolean' ||
              typeof value.fullSphereCoverage !== 'boolean' ||
              !inRange(value.horizontalCoverageDeg, 0, 360) ||
              !inRange(value.verticalCoverageDeg, 0, 180) ||
              !Array.isArray(value.marks) || value.marks.length !== pointCount || pointCount < 8 ||
              maximumAzimuthGapDeg > 90 + 1e-9) {
              return null;
            }
            const geometry = parseStellarPanoramaGeometry(value.geometry);
            if (!geometry) return null;
            const validated = validateEquirectangularPanoramaGeometry(geometry);
            if (validated.horizontalCoverageDeg < 360 - 1e-9 ||
              Math.abs(validated.horizontalCoverageDeg - value.horizontalCoverageDeg) > 1e-9 ||
              Math.abs(validated.verticalCoverageDeg - value.verticalCoverageDeg) > 1e-9 ||
              validated.fullSphereCoverage !== value.fullSphereCoverage) {
              return null;
            }
            if (value.geometrySource === 'gpano-xmp' &&
              (value.metadataStatusAtImport !== 'complete' || value.standardXmpPacketFound !== true ||
                typeof value.projectionTypeAtImport !== 'string' ||
                value.projectionTypeAtImport.toLowerCase() !== 'equirectangular')) {
              return null;
            }

            const marks: SavedStellarPanoramaSkylineDerivation['marks'] = [];
            const recomputedPoints: SavedStellarLocalHorizonSource['points'] = [];
            for (const item of value.marks) {
              if (!isRecord(item) || !inRange(item.xPx, 0, geometry.imageWidthPx - 1) ||
                !inRange(item.yPx, 0, geometry.imageHeightPx - 1) ||
                !inRange(item.azimuthDeg, 0, 360) || item.azimuthDeg === 360 ||
                !inRange(item.altitudeDeg, -90, 90)) return null;
              let direction;
              try {
                direction = panoramaPixelToLocalDirection(geometry, { xPx: item.xPx, yPx: item.yPx });
              } catch {
                return null;
              }
              if (Math.abs(direction.azimuthDeg - item.azimuthDeg) > 1e-9 ||
                Math.abs(direction.altitudeDeg - item.altitudeDeg) > 1e-9) return null;
              marks.push({
                xPx: item.xPx,
                yPx: item.yPx,
                azimuthDeg: item.azimuthDeg,
                altitudeDeg: item.altitudeDeg
              });
              recomputedPoints.push({ azimuthDeg: direction.azimuthDeg, altitudeDeg: direction.altitudeDeg });
            }

            let normalized;
            try {
              normalized = normalizeStellarLocalHorizonMask({
                sourceKind: 'derived',
                sourceLabel: 'portable-panorama-validation',
                points: recomputedPoints
              });
            } catch {
              return null;
            }
            if (normalized.points.length !== pointCount ||
              Math.abs(normalized.maximumAzimuthGapDeg - maximumAzimuthGapDeg) > 1e-9 ||
              normalized.points.length !== sourcePoints.length) return null;
            for (let index = 0; index < normalized.points.length; index += 1) {
              const left = normalized.points[index]!;
              const right = sourcePoints[index]!;
              if (Math.abs(left.azimuthDeg - right.azimuthDeg) > 1e-9 ||
                Math.abs(left.altitudeDeg - right.altitudeDeg) > 1e-9) return null;
            }

            return {
              algorithmId: EQUIRECTANGULAR_PANORAMA_ALGORITHM_ID,
              algorithmVersion: EQUIRECTANGULAR_PANORAMA_ALGORITHM_VERSION,
              geometrySource: value.geometrySource,
              geometry,
              horizontalCoverageDeg: value.horizontalCoverageDeg,
              verticalCoverageDeg: value.verticalCoverageDeg,
              fullSphereCoverage: value.fullSphereCoverage,
              metadataStatusAtImport: value.metadataStatusAtImport,
              ...(value.projectionTypeAtImport === undefined
                ? {}
                : { projectionTypeAtImport: value.projectionTypeAtImport.trim() }),
              metadataScaledToImage: value.metadataScaledToImage,
              standardXmpPacketFound: value.standardXmpPacketFound,
              extendedXmpPacketFound: value.extendedXmpPacketFound,
              marks
            };
          }

          '''.replace('          ', '')
          anchor = 'function parseStellarLocalHorizonSource(value: unknown): SavedStellarLocalHorizonSource | null {'
          if s.count(anchor) != 1:
              raise SystemExit(f'panorama helper anchor count={s.count(anchor)}')
          s = s.replace(anchor, helper + anchor, 1)

          once(
            "    (value.format !== 'csv' && value.format !== 'json' && value.format !== 'dem') ||",
            "    (value.format !== 'csv' && value.format !== 'json' && value.format !== 'dem' && value.format !== 'panorama') ||"
          )
          once(
            "    typeof value.modifiedAfterImport !== 'boolean') {",
            "    typeof value.modifiedAfterImport !== 'boolean' || value.dataUrl !== undefined) {"
          )
          once(
            "  const maximumSourceBytes = value.format === 'dem' ? 64 * 1024 * 1024 : 2 * 1024 * 1024;",
            "  const maximumSourceBytes = value.format === 'dem'\n    ? 64 * 1024 * 1024\n    : value.format === 'panorama'\n      ? 25 * 1024 * 1024\n      : 2 * 1024 * 1024;"
          )
          once(
            "      sourceKind: value.format === 'dem' ? 'derived' : 'external',",
            "      sourceKind: value.format === 'dem' || value.format === 'panorama' ? 'derived' : 'external',"
          )
          old_deriv = '''  const demDerivation = value.format === 'dem'
            ? parseStellarDemSkylineDerivation(
                value.demDerivation,
                value.pointCount,
                value.maximumAzimuthGapDeg
              )
            : undefined;
          if ((value.format === 'dem' && demDerivation === null) ||
            (value.format !== 'dem' && value.demDerivation !== undefined)) {
            return null;
          }
          '''.replace('          ', '')
          new_deriv = '''  const demDerivation = value.format === 'dem'
            ? parseStellarDemSkylineDerivation(
                value.demDerivation,
                value.pointCount,
                value.maximumAzimuthGapDeg
              )
            : undefined;
          const panoramaDerivation = value.format === 'panorama'
            ? parseStellarPanoramaSkylineDerivation(
                value.panoramaDerivation,
                normalized.points,
                value.pointCount,
                value.maximumAzimuthGapDeg
              )
            : undefined;
          if ((value.format === 'dem' && demDerivation === null) ||
            (value.format !== 'dem' && value.demDerivation !== undefined) ||
            (value.format === 'panorama' && panoramaDerivation === null) ||
            (value.format !== 'panorama' && value.panoramaDerivation !== undefined)) {
            return null;
          }
          '''.replace('          ', '')
          once(old_deriv, new_deriv)
          once(
            "    ...(demDerivation ? { demDerivation } : {})\n  };",
            "    ...(demDerivation ? { demDerivation } : {}),\n    ...(panoramaDerivation ? { panoramaDerivation } : {})\n  };"
          )

          old_versions = "    version !== 5 && version !== 6 && version !== 7 && version !== 8 && version !== 9 &&\n    version !=="
          if s.count(old_versions) != 2:
              raise SystemExit(f'version-chain count={s.count(old_versions)}')
          s = s.replace(
            old_versions,
            "    version !== 5 && version !== 6 && version !== 7 && version !== 8 && version !== 9 &&\n    version !== 10 && version !==",
            2
          )

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/shared/portable.ts
          git commit -m "Add portable v11 panorama provenance validation"
          git push origin HEAD:agent/panorama-skyline-ui
