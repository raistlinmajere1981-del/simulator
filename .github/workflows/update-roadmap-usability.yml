name: Update usability roadmap

on:
  push:
    branches: [docs/context-help-text-setup-roadmap]
    paths:
      - scripts/update_roadmap_usability.py
      - .github/workflows/update-roadmap-usability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/context-help-text-setup-roadmap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_roadmap_usability.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: schedule contextual help and text experiment setup"
          git push origin HEAD:docs/context-help-text-setup-roadmap
