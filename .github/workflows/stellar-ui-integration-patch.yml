name: Stellar UI Integration Patch

on:
  push:
    branches:
      - agent/stellar-observation-ui

permissions:
  contents: write

jobs:
  patch-app-next:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stellar-observation-ui
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded AppNext patch
        run: node scripts/apply-stellar-appnext.mjs

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet -- src/renderer/src/AppNext.tsx; then
            echo "No AppNext changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/AppNext.tsx
          git commit -m "Aşama 6.8 yıldız senaryosunu AppNext'e bağla"
          git push origin HEAD:agent/stellar-observation-ui
