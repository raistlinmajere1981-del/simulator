name: Patch 6.27 GPano parser
on:
  push:
    branches: [agent/panorama-skyline-ui]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panorama-skyline-ui
      - name: Apply guarded parser fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/simulation/gpano-xmp.ts')
          s = p.read_text()
          replacements = [
            ("return value.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');", "return value.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');"),
            ("const roll = rollRaw === null ? 0 : range(finiteNumber(rollRaw), -180, 180);", "const parsedRoll = rollRaw === null ? 0 : finiteNumber(rollRaw);\n  const roll = parsedRoll !== null && parsedRoll > -180 && parsedRoll <= 180 ? parsedRoll : null;"),
            ("status: input.standardPackets.length > 0 ? 'absent' : 'absent',", "status: 'absent',")
          ]
          # The regex literal's textual representation can be deceptively similar;
          # assert it parses to the canonical JS escape-regexp pattern via a direct line rewrite.
          lines = s.splitlines()
          found = 0
          for i, line in enumerate(lines):
              if line.strip().startswith('return value.replace(') and i > 0 and 'escapeRegExp' in lines[i-1]:
                  lines[i] = "  return value.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');"
                  found += 1
          if found != 1:
              raise SystemExit(f'escapeRegExp return count={found}')
          s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
          for old, new in replacements[1:]:
              if s.count(old) != 1:
                  raise SystemExit(f'anchor count={s.count(old)} for {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/simulation/gpano-xmp.ts
          git commit -m "Tighten GPano parser boundaries"
          git push origin HEAD:agent/panorama-skyline-ui
