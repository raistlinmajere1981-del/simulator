name: Patch 6.25 AppNext

on:
  push:
    branches:
      - agent/dem-skyline-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dem-skyline-ui
      - name: Apply guarded AppNext patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/renderer/src/AppNext.tsx')
          text = path.read_text()

          panel_anchor = """                  settings={stellarObservationSettings}
                  externalLocalHorizonSource={stellarLocalHorizonSource}
          """
          panel_replacement = """                  settings={stellarObservationSettings}
                  observerHeightM={inputs.observerHeightM}
                  externalLocalHorizonSource={stellarLocalHorizonSource}
          """
          if text.count(panel_anchor) != 1:
              raise SystemExit(f'panel prop anchor count={text.count(panel_anchor)}')
          text = text.replace(panel_anchor, panel_replacement, 1)

          load_anchor = """          points: saved.stellarLocalHorizonSource.points.map((point) => ({ ...point })),
          warnings: [...saved.stellarLocalHorizonSource.warnings]
          """
          load_replacement = """          points: saved.stellarLocalHorizonSource.points.map((point) => ({ ...point })),
          warnings: [...saved.stellarLocalHorizonSource.warnings],
          ...(saved.stellarLocalHorizonSource.demDerivation
            ? { demDerivation: { ...saved.stellarLocalHorizonSource.demDerivation } }
            : {})
          """
          if text.count(load_anchor) != 1:
              raise SystemExit(f'load source anchor count={text.count(load_anchor)}')
          text = text.replace(load_anchor, load_replacement, 1)

          reopen_anchor = """              points: saved.stellarLocalHorizonSource.points.map((point) => ({ ...point })),
              warnings: [...saved.stellarLocalHorizonSource.warnings]
            }
          """
          reopen_replacement = """              points: saved.stellarLocalHorizonSource.points.map((point) => ({ ...point })),
              warnings: [...saved.stellarLocalHorizonSource.warnings],
              ...(saved.stellarLocalHorizonSource.demDerivation
                ? { demDerivation: { ...saved.stellarLocalHorizonSource.demDerivation } }
                : {})
            }
          """
          if text.count(reopen_anchor) != 1:
              raise SystemExit(f'reopen source anchor count={text.count(reopen_anchor)}')
          text = text.replace(reopen_anchor, reopen_replacement, 1)

          path.write_text(text)
          PY
      - name: Commit protected patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/renderer/src/AppNext.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Wire DEM skyline props and persistence clones"
          git push origin HEAD:agent/dem-skyline-ui
