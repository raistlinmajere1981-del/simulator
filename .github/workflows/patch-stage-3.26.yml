name: Patch stage 3.26 terrain visualization

on:
  push:
    branches:
      - agent/terrain-3d-visualization

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terrain-3d-visualization
          fetch-depth: 0
      - name: Patch renderer and UI
        run: python scripts/patch_stage_3_26.py
      - name: Commit terrain visualization wiring
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/AppNext.tsx src/renderer/src/WorldModelViewport.tsx src/renderer/src/world-model-viewport.css
          git commit -m "feat: wire terrain profile into 3d scenes"
          git push origin HEAD:agent/terrain-3d-visualization
