name: Fix stage 5.2 UI details

on:
  push:
    branches:
      - agent/photo-calibration-ui
    paths:
      - scripts/fix_stage_5_2_ui.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/photo-calibration-ui
          fetch-depth: 0
      - run: python scripts/fix_stage_5_2_ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/PhotoCalibrationControl.tsx src/renderer/src/photo-calibration-control.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep photo preview and scale calibration markers"
          git push origin HEAD:agent/photo-calibration-ui
