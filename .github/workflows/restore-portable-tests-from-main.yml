name: Restore Portable Tests From Main

on:
  push:
    branches:
      - agent/stellar-skyline-import-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stellar-skyline-import-ui
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore tests from main with v8 expectations
        run: node scripts/restore-portable-tests-from-main.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit restored tests
        shell: bash
        run: |
          if git diff --quiet -- tests/portable.test.ts tests/report.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/portable.test.ts tests/report.test.ts
          git commit -m "Portable legacy testlerini main tabanından geri kur"
          git push origin HEAD:agent/stellar-skyline-import-ui
