name: Stage 6.12 Roadmap Patch

on:
  push:
    branches:
      - agent/stellar-local-horizon-mask

permissions:
  contents: write

jobs:
  patch-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stellar-local-horizon-mask
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded roadmap patch
        run: node scripts/apply-roadmap-6.12.mjs
      - name: Check diff
        run: git diff --check
      - name: Commit roadmap summary
        shell: bash
        run: |
          if git diff --quiet -- docs/roadmap.md; then
            echo "No roadmap change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap.md
          git commit -m "Aşama 6.12 yol haritası özetini güncelle"
          git push origin HEAD:agent/stellar-local-horizon-mask
