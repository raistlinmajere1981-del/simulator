name: Stellar Skyline Staging Fix

on:
  push:
    branches:
      - agent/stellar-skyline-import-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stellar-skyline-import-ui
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded staging and test patch
        run: node scripts/apply-stellar-skyline-staging-fix.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          if git diff --quiet -- src/renderer/src/AppNext.tsx src/renderer/src/StellarObservationPanel.tsx tests/report.test.ts; then
            echo "No product change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/AppNext.tsx src/renderer/src/StellarObservationPanel.tsx tests/report.test.ts
          git commit -m "Skyline dosya kaynağını uygulama anına kadar taslakta tut"
          git push origin HEAD:agent/stellar-skyline-import-ui
