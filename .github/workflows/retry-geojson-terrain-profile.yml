name: Retry GeoJSON terrain profile stage

on:
  push:
    branches:
      - agent/geojson-terrain-profile-import
    paths:
      - .github/workflows/retry-geojson-terrain-profile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geojson-terrain-profile-import
          fetch-depth: 0

      - name: Execute patched implementation script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow_path = Path('.github/workflows/apply-geojson-terrain-profile.yml')
          raw = workflow_path.read_text(encoding='utf-8')
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = raw.index(marker_start) + len(marker_start)
          end = raw.index(marker_end, start)
          script = textwrap.dedent(raw[start:end])

          pattern = r"replace_once\(\n\s+simulator_path,\n\s+'''  importTerrainProfileWithMapping\(.*?\n\)\n\nhelper_path"
          replacement = r'''replace_regex(
              simulator_path,
              r"  importTerrainProfileWithMapping\(\n    requestId: string,\n    mapping: TerrainProfileColumnMapping,\n    context: TerrainProfileImportContext\n  \): Promise<ImportTerrainProfileResult>;\n}",
              '''  importTerrainProfileWithMapping(
                requestId: string,
                mapping: TerrainProfileColumnMapping,
                context: TerrainProfileImportContext
              ): Promise<ImportTerrainProfileResult>;
              importGeoJsonTerrainProfile(
                context: TerrainProfileImportContext
              ): Promise<ImportTerrainProfileResult>;
            }'''
          )

          helper_path'''
          script, count = re.subn(pattern, lambda _match: replacement, script, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'Could not patch API replacement; matches={count}')
          exec(compile(script, 'geojson-stage.py', 'exec'))
          PY

      - name: Remove retry workflow
        run: rm -f .github/workflows/retry-geojson-terrain-profile.yml

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add GeoJSON terrain profile import"
          git push origin HEAD:agent/geojson-terrain-profile-import
