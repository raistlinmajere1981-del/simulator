name: Retry GeoJSON terrain profile stage

on:
  push:
    branches:
      - agent/geojson-terrain-profile-import
    paths:
      - .github/workflows/retry-geojson-terrain-profile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geojson-terrain-profile-import
          fetch-depth: 0

      - name: Execute patched implementation script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/apply-geojson-terrain-profile.yml')
          raw = workflow_path.read_text(encoding='utf-8')
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = raw.index(marker_start) + len(marker_start)
          end = raw.index(marker_end, start)
          script = textwrap.dedent(raw[start:end])

          block_start_token = "replace_once(\n    simulator_path,\n    '''  importTerrainProfileWithMapping("
          block_end_token = "\n\nhelper_path = 'src/simulation/terrain-import-application.ts'"
          block_start = script.index(block_start_token)
          block_end = script.index(block_end_token, block_start)

          pattern = (
              r"  importTerrainProfileWithMapping\(\n"
              r"    requestId: string,\n"
              r"    mapping: TerrainProfileColumnMapping,\n"
              r"    context: TerrainProfileImportContext\n"
              r"  \): Promise<ImportTerrainProfileResult>;\n}"
          )
          api_replacement = (
              "  importTerrainProfileWithMapping(\n"
              "    requestId: string,\n"
              "    mapping: TerrainProfileColumnMapping,\n"
              "    context: TerrainProfileImportContext\n"
              "  ): Promise<ImportTerrainProfileResult>;\n"
              "  importGeoJsonTerrainProfile(\n"
              "    context: TerrainProfileImportContext\n"
              "  ): Promise<ImportTerrainProfileResult>;\n"
              "}"
          )
          replacement = (
              "replace_regex(\n"
              "    simulator_path,\n"
              f"    {pattern!r},\n"
              f"    {api_replacement!r}\n"
              ")"
          )
          script = script[:block_start] + replacement + script[block_end:]

          repeated_old = (
              "replace_once(helper_path, 'profile: ImportedTerrainProfile', "
              "'profile: TerrainProfileImport')\n"
              "replace_once(helper_path, 'profile: ImportedTerrainProfile', "
              "'profile: TerrainProfileImport')"
          )
          repeated_new = (
              "helper_text = read(helper_path)\n"
              "if helper_text.count('profile: ImportedTerrainProfile') != 2:\n"
              "    raise RuntimeError('Unexpected terrain import profile type count')\n"
              "Path(helper_path).write_text(\n"
              "    helper_text.replace('profile: ImportedTerrainProfile', "
              "'profile: TerrainProfileImport'),\n"
              "    encoding='utf-8'\n"
              ")"
          )
          if script.count(repeated_old) != 1:
              raise RuntimeError('Could not find repeated terrain import type patch')
          script = script.replace(repeated_old, repeated_new, 1)

          preload_start_token = "replace_once(\n    preload_path,\n    '''  ) => ipcRenderer.invoke("
          preload_end_token = "\n\nmain_path = 'src/main/index.ts'"
          preload_start = script.index(preload_start_token)
          preload_end = script.index(preload_end_token, preload_start)
          preload_old = (
              "  ) => ipcRenderer.invoke(\n"
              "    'terrain:import-csv-mapped',\n"
              "    requestId,\n"
              "    mapping,\n"
              "    context\n"
              "  ) as Promise<ImportTerrainProfileResult>\n"
              "};"
          )
          preload_new = (
              "  ) => ipcRenderer.invoke(\n"
              "    'terrain:import-csv-mapped',\n"
              "    requestId,\n"
              "    mapping,\n"
              "    context\n"
              "  ) as Promise<ImportTerrainProfileResult>,\n"
              "  importGeoJsonTerrainProfile: (context: TerrainProfileImportContext) =>\n"
              "    ipcRenderer.invoke(\n"
              "      'terrain:import-geojson',\n"
              "      context\n"
              "    ) as Promise<ImportTerrainProfileResult>\n"
              "};"
          )
          preload_replacement = (
              "replace_once(\n"
              "    preload_path,\n"
              f"    {preload_old!r},\n"
              f"    {preload_new!r}\n"
              ")"
          )
          script = script[:preload_start] + preload_replacement + script[preload_end:]

          exec(compile(script, 'geojson-stage.py', 'exec'))
          PY

      - name: Remove retry workflow
        run: rm -f .github/workflows/retry-geojson-terrain-profile.yml

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add GeoJSON terrain profile import"
          git push origin HEAD:agent/geojson-terrain-profile-import
