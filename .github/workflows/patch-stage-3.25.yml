name: Patch stage 3.25 UI

on:
  push:
    branches:
      - agent/geographic-visual-layers

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geographic-visual-layers
          fetch-depth: 0
      - name: Patch visual layer state into AppNext
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/renderer/src/AppNext.tsx')
          text = path.read_text()

          interface_anchor = '''interface GeoidConversionRecordState {
            prediction: ModelPrediction;
            modelVersion: string;
          }
          '''
          if 'interface VisualLayerState' not in text:
              if interface_anchor not in text:
                  raise SystemExit('Visual layer interface anchor not found')
              text = text.replace(interface_anchor, interface_anchor + '''
          interface VisualLayerState {
            geographicBoundaries: boolean;
            grid: boolean;
          }
          ''', 1)

          old_sidebar_signature = '''function Sidebar({
            experiments,
            onLoadExperiment
          }: {
            experiments: SavedExperiment[];
            onLoadExperiment(experiment: SavedExperiment): void;
          }): React.JSX.Element {'''
          new_sidebar_signature = '''function Sidebar({
            experiments,
            visualLayers,
            onLoadExperiment,
            onVisualLayerChange
          }: {
            experiments: SavedExperiment[];
            visualLayers: VisualLayerState;
            onLoadExperiment(experiment: SavedExperiment): void;
            onVisualLayerChange(key: keyof VisualLayerState, enabled: boolean): void;
          }): React.JSX.Element {'''
          if old_sidebar_signature in text:
              text = text.replace(old_sidebar_signature, new_sidebar_signature, 1)
          elif 'visualLayers: VisualLayerState;' not in text:
              raise SystemExit('Sidebar signature anchor not found')

          visual_start = '      <section className="side-section compact grow disabled-section">\n        <div className="section-heading">\n          <span>Görsel katmanlar</span>'
          visual_end = '      <section className="time-card disabled-section">'
          if visual_start in text:
              start = text.index(visual_start)
              end = text.index(visual_end, start)
              replacement = '''      <section className="side-section compact grow">
        <div className="section-heading">
          <span>Görsel katmanlar</span>
          <span className="section-state">2 / 5 hazır</span>
        </div>
        <label className="switch-row">
          <span>Kıta / Ülke Sınırları</span>
          <input
            type="checkbox"
            checked={visualLayers.geographicBoundaries}
            onChange={(event) => onVisualLayerChange('geographicBoundaries', event.currentTarget.checked)}
          />
          <span className="switch" />
        </label>
        {['Topografya Görselleştirme', 'Gece Işıkları', 'Atmosfer Profili'].map((item) => (
          <label className="switch-row unavailable-layer" key={item}>
            <span>{item}</span><input type="checkbox" disabled /><span className="switch" />
          </label>
        ))}
        <label className="switch-row">
          <span>Izgara</span>
          <input
            type="checkbox"
            checked={visualLayers.grid}
            onChange={(event) => onVisualLayerChange('grid', event.currentTarget.checked)}
          />
          <span className="switch" />
        </label>
      </section>

'''
              text = text[:start] + replacement + text[end:]
          elif '2 / 5 hazır' not in text:
              raise SystemExit('Visual layer section anchor not found')

          state_anchor = "  const [storageMessage, setStorageMessage] = useState('');"
          if 'const [visualLayers, setVisualLayers]' not in text:
              if state_anchor not in text:
                  raise SystemExit('Visual layer state anchor not found')
              text = text.replace(state_anchor, state_anchor + '''
          const [visualLayers, setVisualLayers] = useState<VisualLayerState>({
            geographicBoundaries: true,
            grid: true
          });''', 1)

          old_sidebar_call = '        <Sidebar experiments={savedExperiments} onLoadExperiment={loadExperiment} />'
          new_sidebar_call = '''        <Sidebar
          experiments={savedExperiments}
          visualLayers={visualLayers}
          onLoadExperiment={loadExperiment}
          onVisualLayerChange={(key, enabled) => {
            setVisualLayers((current) => ({ ...current, [key]: enabled }));
          }}
        />'''
          if old_sidebar_call in text:
              text = text.replace(old_sidebar_call, new_sidebar_call, 1)
          elif 'visualLayers={visualLayers}' not in text:
              raise SystemExit('Sidebar call anchor not found')

          old_model_signature = '''function ModelCard({
            metadata,
            run,
            inputs,
            onShowTrace
          }: {
            metadata: ModelMetadata;
            run: ModelRun | undefined;
            inputs: SimulatorInputs;
            onShowTrace(): void;
          }): React.JSX.Element {'''
          new_model_signature = '''function ModelCard({
            metadata,
            run,
            inputs,
            visualLayers,
            onShowTrace
          }: {
            metadata: ModelMetadata;
            run: ModelRun | undefined;
            inputs: SimulatorInputs;
            visualLayers: VisualLayerState;
            onShowTrace(): void;
          }): React.JSX.Element {'''
          if old_model_signature in text:
              text = text.replace(old_model_signature, new_model_signature, 1)
          elif 'visualLayers: VisualLayerState;' not in text[text.find('function ModelCard'):]:
              raise SystemExit('ModelCard signature anchor not found')

          viewport_anchor = '''  targetLatitudeDeg={inputs.targetLatitudeDeg}
  targetLongitudeDeg={inputs.targetLongitudeDeg}
/>'''
          viewport_new = '''  targetLatitudeDeg={inputs.targetLatitudeDeg}
  targetLongitudeDeg={inputs.targetLongitudeDeg}
  showGeographicBoundaries={visualLayers.geographicBoundaries}
  showGrid={visualLayers.grid}
/>'''
          if viewport_anchor in text:
              text = text.replace(viewport_anchor, viewport_new, 1)
          elif 'showGeographicBoundaries={visualLayers.geographicBoundaries}' not in text:
              raise SystemExit('Viewport props anchor not found')

          model_call_anchor = '''                inputs={effectiveInputs}
                onShowTrace={() => setTraceModelId(model.metadata.id)}'''
          model_call_new = '''                inputs={effectiveInputs}
                visualLayers={visualLayers}
                onShowTrace={() => setTraceModelId(model.metadata.id)}'''
          if model_call_anchor in text:
              text = text.replace(model_call_anchor, model_call_new, 1)
          elif 'visualLayers={visualLayers}' not in text[text.rfind('<div className="model-grid">'):]:
              raise SystemExit('ModelCard call anchor not found')

          path.write_text(text)
          PY
      - name: Commit UI patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/AppNext.tsx
          git commit -m "feat: wire geographic visual layer controls"
          git push origin HEAD:agent/geographic-visual-layers
