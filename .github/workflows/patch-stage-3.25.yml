name: Patch stage 3.25 UI

on:
  push:
    branches:
      - agent/geographic-visual-layers

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/geographic-visual-layers
          fetch-depth: 0
      - name: Patch AppNext
        run: python scripts/patch_stage_3_25.py
      - name: Commit UI patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/AppNext.tsx
          git commit -m "feat: wire geographic visual layer controls"
          git push origin HEAD:agent/geographic-visual-layers
