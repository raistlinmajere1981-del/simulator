name: Patch 6.27 panorama panel
on:
  push:
    branches: [agent/panorama-skyline-ui]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/panorama-skyline-ui
      - name: Apply guarded panel patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/renderer/src/StellarObservationPanel.tsx')
          s = p.read_text()

          def once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'anchor count={count} for {old[:100]!r}')
              s = s.replace(old, new, 1)

          once(
              "import { StellarDemSkylineControl } from './StellarDemSkylineControl';",
              "import { StellarDemSkylineControl } from './StellarDemSkylineControl';\nimport { StellarPanoramaSkylineControl } from './StellarPanoramaSkylineControl';"
          )
          once(
              "        ...(source.demDerivation ? { demDerivation: { ...source.demDerivation } } : {})",
              "        ...(source.demDerivation ? { demDerivation: { ...source.demDerivation } } : {}),\n        ...(source.panoramaDerivation\n          ? {\n              panoramaDerivation: {\n                ...source.panoramaDerivation,\n                geometry: { ...source.panoramaDerivation.geometry },\n                marks: source.panoramaDerivation.marks.map((mark) => ({ ...mark }))\n              }\n            }\n          : {})"
          )
          old_prepare = '''  const prepareDemSkylineSource = (source: SavedStellarLocalHorizonSource): void => {
          setDraftExternalLocalHorizonSource(cloneExternalSource(source));
          setLocalHorizonDraft((current) => ({
            ...current,
            localHorizonEnabled: true,
            localHorizonSourceMode: 'external'
          }));
          setHorizonImportMessage(`“${source.fileName}” DEM skyline taslağı hazır. Uygula ve hesapla ile yıldız izine bağlanacak.`);
        };
          '''.replace('          ', '')
          new_prepare = '''  const prepareDerivedSkylineSource = (
            source: SavedStellarLocalHorizonSource,
            sourceLabel: 'DEM' | 'panorama'
          ): void => {
            setDraftExternalLocalHorizonSource(cloneExternalSource(source));
            setLocalHorizonDraft((current) => ({
              ...current,
              localHorizonEnabled: true,
              localHorizonSourceMode: 'external'
            }));
            setHorizonImportMessage(
              `“${source.fileName}” ${sourceLabel} skyline taslağı hazır. Uygula ve hesapla ile yıldız izine bağlanacak.`
            );
          };
          '''.replace('          ', '')
          once(old_prepare, new_prepare)

          old_dem = '''        <StellarDemSkylineControl
                observerLatitudeDeg={result.latitudeDeg}
                observerLongitudeDeg={result.longitudeDeg}
                observerHeightM={observerHeightM}
                onPreparedSource={prepareDemSkylineSource}
              />
          '''.replace('          ', '')
          new_dem = '''        <StellarDemSkylineControl
            observerLatitudeDeg={result.latitudeDeg}
            observerLongitudeDeg={result.longitudeDeg}
            observerHeightM={observerHeightM}
            onPreparedSource={(source) => prepareDerivedSkylineSource(source, 'DEM')}
          />

          <StellarPanoramaSkylineControl
            onPreparedSource={(source) => prepareDerivedSkylineSource(source, 'panorama')}
          />
          '''.replace('          ', '')
          once(old_dem, new_dem)

          once(
              "              <small>DOSYA SKYLINE KAYNAĞI</small>",
              "              <small>YEREL SKYLINE KAYNAĞI</small>"
          )
          once(
              "              <span>{draftExternalLocalHorizonSource.format === 'dem' ? 'DEM · türetilmiş geometrik' : draftExternalLocalHorizonSource.format.toUpperCase()} · {draftExternalLocalHorizonSource.pointCount} nokta · en büyük boşluk {angleFormatter.format(draftExternalLocalHorizonSource.maximumAzimuthGapDeg)}°</span>",
              "              <span>{draftExternalLocalHorizonSource.format === 'dem'\n                ? 'DEM · türetilmiş geometrik'\n                : draftExternalLocalHorizonSource.format === 'panorama'\n                  ? 'PANORAMA · türetilmiş geometrik'\n                  : draftExternalLocalHorizonSource.format.toUpperCase()} · {draftExternalLocalHorizonSource.pointCount} nokta · en büyük boşluk {angleFormatter.format(draftExternalLocalHorizonSource.maximumAzimuthGapDeg)}°</span>"
          )
          old_dem_details = '''        {draftExternalLocalHorizonSource.demDerivation && (
                  <span>ΔA {angleFormatter.format(draftExternalLocalHorizonSource.demDerivation.azimuthStepDeg)}° · Δs {angleFormatter.format(draftExternalLocalHorizonSource.demDerivation.distanceStepM)} m · menzil {angleFormatter.format(draftExternalLocalHorizonSource.demDerivation.maximumDistanceM / 1_000)} km · {draftExternalLocalHorizonSource.demDerivation.samplingMethod}</span>
                )}
          '''.replace('          ', '')
          new_dem_details = '''              {draftExternalLocalHorizonSource.demDerivation && (
                <span>ΔA {angleFormatter.format(draftExternalLocalHorizonSource.demDerivation.azimuthStepDeg)}° · Δs {angleFormatter.format(draftExternalLocalHorizonSource.demDerivation.distanceStepM)} m · menzil {angleFormatter.format(draftExternalLocalHorizonSource.demDerivation.maximumDistanceM / 1_000)} km · {draftExternalLocalHorizonSource.demDerivation.samplingMethod}</span>
              )}
              {draftExternalLocalHorizonSource.panoramaDerivation && (
                <span>{draftExternalLocalHorizonSource.panoramaDerivation.geometrySource === 'gpano-xmp' ? 'GPano XMP' : 'Manuel geometri'} · yatay {angleFormatter.format(draftExternalLocalHorizonSource.panoramaDerivation.horizontalCoverageDeg)}° · heading {angleFormatter.format(draftExternalLocalHorizonSource.panoramaDerivation.geometry.poseHeadingDeg)}° · {draftExternalLocalHorizonSource.panoramaDerivation.marks.length} işaret</span>
              )}
          '''.replace('          ', '')
          once(old_dem_details, new_dem_details)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/renderer/src/StellarObservationPanel.tsx
          git commit -m "Integrate panorama skyline editor into stellar panel"
          git push origin HEAD:agent/panorama-skyline-ui
