name: Update stage 5.2 docs

on:
  push:
    branches:
      - agent/photo-calibration-ui
    paths:
      - scripts/update_stage_5_2_docs.py

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/photo-calibration-ui
          fetch-depth: 0
      - run: python scripts/update_stage_5_2_docs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: mark photo calibration UI complete"
          git push origin HEAD:agent/photo-calibration-ui
