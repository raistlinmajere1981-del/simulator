name: Apply terrain point dragging

on:
  push:
    branches:
      - agent/terrain-profile-point-drag
    paths:
      - .github/workflows/apply-terrain-point-drag.yml
      - scripts/apply-terrain-point-drag.py
      - scripts/fix-terrain-point-drag-generator.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terrain-profile-point-drag
          fetch-depth: 0

      - name: Prepare generator
        run: python3 scripts/fix-terrain-point-drag-generator.py

      - name: Apply product changes
        run: python3 scripts/apply-terrain-point-drag.py

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary patch scripts
        run: rm -f scripts/apply-terrain-point-drag.py scripts/fix-terrain-point-drag-generator.py

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "drag terrain profile points on the graph"
          git push origin HEAD:agent/terrain-profile-point-drag
