name: Fix stage 5.6 uncertainty persistence
on:
  push:
    branches: [agent/text-experiment-preparation]
    paths:
      - scripts/fix_stage_5_6_uncertainty_persistence.py
      - .github/workflows/fix-stage-5-6-uncertainty-persistence.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/text-experiment-preparation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_stage_5_6_uncertainty_persistence.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist text-applied model uncertainty without photo"
          git push origin HEAD:agent/text-experiment-preparation
