name: Patch 6.25 DEM skyline report

on:
  push:
    branches:
      - agent/dem-skyline-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dem-skyline-ui
      - name: Apply guarded report patch
        run: python scripts/patch-6.25-report.py
      - name: Commit protected patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/report/html-report.ts
          git diff --cached --quiet && exit 0
          git commit -m "Report DEM skyline derivation provenance"
          git push origin HEAD:agent/dem-skyline-ui
